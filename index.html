<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>大会リザルトシステム</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #1e2230;
      color: #ffffff;
      margin: 0; padding: 20px;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh;
    }

    /* CSV読み込みステータス */
    .status-bar {
      position: fixed; top: 10px; right: 10px;
      padding: 6px 12px; border-radius: 20px;
      font-size: 0.8rem; font-weight: bold;
      display: flex; align-items: center; gap: 6px;
      background: rgba(0,0,0,0.6); border: 1px solid #555;
    }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #888; }
    .status-dot.ok { background: #00ff66; box-shadow: 0 0 8px #00ff66; }
    .status-dot.ng { background: #ff3333; box-shadow: 0 0 8px #ff3333; }

    /* 全体コンテナ */
    .container {
      width: 100%; max-width: 950px;
      margin-top: 30px; text-align: center;
    }

    /* パンくずリスト */
    .breadcrumb {
      display: flex; justify-content: center; align-items: center; gap: 10px;
      margin-bottom: 20px; font-size: 0.95rem; color: #b0b8d0;
    }
    .breadcrumb-item { cursor: pointer; text-decoration: underline; color: #00d2ff; }
    .breadcrumb-item:hover { color: #ffffff; }
    .breadcrumb-current { color: #ffffff; font-weight: bold; }

    /* タイトルエリア */
    h1 { color: #ffffff; margin-bottom: 10px; }
    p.subtitle { color: #b0b8d0; margin-top: 0; margin-bottom: 25px; }

    /* ボタン・カード一覧 */
    .card-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px; margin-top: 20px;
    }
    .selection-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(0, 210, 255, 0.4);
      border-radius: 12px; padding: 25px 15px;
      font-size: 1.2rem; font-weight: bold; color: #ffffff;
      cursor: pointer; transition: all 0.2s ease;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .selection-card:hover {
      background: rgba(0, 210, 255, 0.25);
      border-color: #00d2ff;
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0, 210, 255, 0.3);
    }
    .selection-card .sub { font-size: 0.85rem; color: #c0c8e0; font-weight: normal; margin-top: 5px; }

    /* タブ切り替え */
    .tab-container {
      display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap;
    }
    .tab-btn {
      background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.25);
      color: #e0e0e0; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
      transition: all 0.2s;
    }
    .tab-btn:hover { background: rgba(0, 210, 255, 0.2); }
    .tab-btn.active {
      background: #00d2ff; color: #000; font-weight: bold; border-color: #00d2ff;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
    }

    /* 操作ガイド */
    .anim-hint {
      font-size: 0.85rem; color: #00d2ff; margin-bottom: 15px; opacity: 0.9;
    }

    /* リザルトテーブル */
    .table-container {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.15);
      overflow-x: auto; margin-top: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    table { width: 100%; border-collapse: collapse; text-align: center; white-space: nowrap; }
    th, td { padding: 14px 12px; font-size: 0.95rem; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    th { background: rgba(0, 210, 255, 0.25); color: #00d2ff; font-size: 1.0rem; }
    th small { font-weight: normal; color: #e0e5f5; display: block; font-size: 0.78rem; }

    /* スコア関連色分け */
    .p-perfect { color: #ffff00; font-weight: bold; }
    .p-great { color: #00ff00; }
    .p-good { color: #00ffff; }
    .p-bad { color: #ff00ff; }
    .p-miss { color: #ff3333; }
    .score { font-family: monospace; font-size: 1.2rem; color: #00ffcc; font-weight: bold; }
    .sub-score { font-family: monospace; font-size: 1.0rem; color: #ffffff; }
    .rank-1 { color: #ffd700; font-size: 1.25rem; font-weight: bold; }
    .rank-2 { color: #e0e0e0; font-size: 1.15rem; font-weight: bold; }
    .rank-3 { color: #cd7f32; font-size: 1.05rem; font-weight: bold; }

    /* 戻るボタン */
    .btn-back {
      margin-top: 25px; background: transparent; border: 1px solid #b0b8d0;
      color: #b0b8d0; padding: 8px 20px; border-radius: 6px; cursor: pointer;
      transition: all 0.2s;
    }
    .btn-back:hover { background: rgba(255,255,255,0.15); color: #fff; }

    /* アニメーション定義 */
    @keyframes dropIn {
      0% { opacity: 0; transform: translateY(-10px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .anim-item { opacity: 0; }
    .anim-active .anim-base { animation: dropIn 0.3s ease forwards 0.0s; }
    .anim-active .anim-p { animation: dropIn 0.4s ease forwards 0.2s; }
    .anim-active .anim-g { animation: dropIn 0.4s ease forwards 0.5s; }
    .anim-active .anim-gd { animation: dropIn 0.4s ease forwards 0.8s; }
    .anim-active .anim-b { animation: dropIn 0.4s ease forwards 1.1s; }
    .anim-active .anim-m { animation: dropIn 0.4s ease forwards 1.4s; }
    .anim-active .anim-song { animation: dropIn 0.4s ease forwards 1.7s; }
    .anim-active .anim-score { animation: dropIn 0.5s ease forwards 2.0s; }
  </style>
</head>
<body>

  <div class="status-bar">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">CSV読み込み確認中...</span>
  </div>

  <div class="container">
    <div class="breadcrumb" id="breadcrumb"></div>
    <div id="view-area"></div>
  </div>

  <script>
    // ラウンドの表記変換マップ
    const ROUND_NAMES = {
      "QF": "準々決勝",
      "SF": "準決勝",
      "Final": "決勝",
      "準々決勝": "準々決勝",
      "準決勝": "準決勝",
      "決勝": "決勝"
    };

    // 規定構造
    const DEFAULT_STRUCTURE = {
      "STANDARD": { "準々決勝": [1], "準決勝": [1], "決勝": [1] },
      "NEXT": { "準々決勝": [1, 2, 3, 4], "準決勝": [1, 2], "決勝": [1] },
      "ULTIMATE": { "準々決勝": [1, 2], "準決勝": [1, 2], "決勝": [1] },
      "DOUBLES": { "準々決勝": [1, 2, 3, 4], "準決勝": [1, 2], "決勝": [1] }
    };

    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSJ9mquQm_J8GBgOq2Qj_aHNJGLbCZTgIU4uK_GH0bjRSYwHbQ6xKLyATkmaTeNX3_6pqzy7XmHmowm/pub?gid=1560276695&single=true&output=csv"; 

    let treeData = {};
    let currentDept = null;
    let currentRound = null;
    let currentMatch = null;
    let currentSongTab = 'final';

    fetchCSV();

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        triggerAnimation();
      }
    });

    function triggerAnimation() {
      const container = document.getElementById('table-box');
      if (!container) return;
      container.classList.remove('anim-active');
      void container.offsetWidth;
      container.classList.add('anim-active');
    }

    async function fetchCSV() {
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');

      try {
        const res = await fetch(`${CSV_URL}&t=${new Date().getTime()}`);
        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
        
        const csvText = await res.text();
        parseCSV(csvText);

        dot.className = "status-dot ok";
        text.innerText = "CSV読み込み完了";
      } catch (err) {
        dot.className = "status-dot ng";
        text.innerText = "CSV読み込み失敗";
      }
      render();
    }

    function parseCSV(text) {
      const rows = text.trim().split(/\r?\n/).map(r => r.split(','));
      treeData = {};

      for (let i = 1; i < rows.length; i++) {
        let [dept, rawRound, match, songNum, songName, name, p, g, gd, b, m, scoreStr] 
          = rows[i].map(c => c ? c.replace(/"/g, '').trim() : '');

        if (!dept || !rawRound || !match || !name) continue;

        // QF/SF等の英名を和名（準々決勝・準決勝・決勝）に標準化
        const round = ROUND_NAMES[rawRound] || rawRound;
        const score = parseInt(scoreStr, 10) || 0;

        if (!treeData[dept]) treeData[dept] = {};
        if (!treeData[dept][round]) treeData[dept][round] = {};
        if (!treeData[dept][round][match]) treeData[dept][round][match] = [];

        treeData[dept][round][match].push({ songNum, songName, name, p, g, gd, b, m, score });
      }
    }

    // ULTIMATE準々決勝専用の試合名（GroupA/GroupB）の取得ヘルパー
    function getMatchDisplayName(dept, round, matchNum) {
      if (dept === 'ULTIMATE' && round === '準々決勝') {
        if (String(matchNum) === '1') return 'GroupA';
        if (String(matchNum) === '2') return 'GroupB';
      }
      return `第${matchNum}試合`;
    }

    function renderBreadcrumb() {
      const nav = document.getElementById('breadcrumb');
      let html = `<span class="breadcrumb-item" onclick="navTo('dept')">TOP (部門選択)</span>`;

      if (currentDept) {
        html += ` ＞ `;
        if (currentRound) {
          html += `<span class="breadcrumb-item" onclick="navTo('round')">${currentDept}</span>`;
        } else {
          html += `<span class="breadcrumb-current">${currentDept}</span>`;
        }
      }

      if (currentRound) {
        html += ` ＞ `;
        if (currentMatch) {
          html += `<span class="breadcrumb-item" onclick="navTo('match')">${currentRound}</span>`;
        } else {
          html += `<span class="breadcrumb-current">${currentRound}</span>`;
        }
      }

      if (currentMatch) {
        const matchLabel = getMatchDisplayName(currentDept, currentRound, currentMatch);
        html += ` ＞ <span class="breadcrumb-current">${matchLabel}</span>`;
      }

      nav.innerHTML = html;
    }

    function navTo(level) {
      if (level === 'dept') { currentDept = null; currentRound = null; currentMatch = null; }
      else if (level === 'round') { currentRound = null; currentMatch = null; }
      else if (level === 'match') { currentMatch = null; }
      render();
    }

    function render() {
      renderBreadcrumb();
      const view = document.getElementById('view-area');

      // 1. 部門選択
      if (!currentDept) {
        const depts = Array.from(new Set([
          ...Object.keys(DEFAULT_STRUCTURE),
          ...Object.keys(treeData)
        ]));

        let cardsHTML = depts.map(d => `
          <div class="selection-card" onclick="selectDept('${d}')">
            ${d} 部門
            <div class="sub">クリックして決定</div>
          </div>
        `).join('');

        view.innerHTML = `
          <h1>部門を選択してください</h1>
          <p class="subtitle">表示したい部門を選択して次へ進みます</p>
          <div class="card-grid">${cardsHTML}</div>
        `;
        return;
      }

      // 2. ラウンド選択（準々決勝・準決勝・決勝）
      if (!currentRound) {
        const defaultRounds = DEFAULT_STRUCTURE[currentDept] ? Object.keys(DEFAULT_STRUCTURE[currentDept]) : [];
        const csvRounds = treeData[currentDept] ? Object.keys(treeData[currentDept]) : [];
        const rounds = Array.from(new Set([...defaultRounds, ...csvRounds]));

        let cardsHTML = rounds.map(r => `
          <div class="selection-card" onclick="selectRound('${r}')">
            ${r}
            <div class="sub">クリックして決定</div>
          </div>
        `).join('');

        view.innerHTML = `
          <h1>ラウンドを選択してください</h1>
          <p class="subtitle">【${currentDept}部門】のラウンドを選択してください</p>
          <div class="card-grid">${cardsHTML}</div>
          <button class="btn-back" onclick="navTo('dept')">← 部門選択に戻る</button>
        `;
        return;
      }

      // 3. 試合選択（第1試合... または GroupA/GroupB）
      if (!currentMatch) {
        const defaultMatches = DEFAULT_STRUCTURE[currentDept]?.[currentRound] 
          ? DEFAULT_STRUCTURE[currentDept][currentRound].map(String) : [];
        const csvMatches = treeData[currentDept]?.[currentRound] 
          ? Object.keys(treeData[currentDept][currentRound]) : [];
        const matches = Array.from(new Set([...defaultMatches, ...csvMatches]))
          .sort((a,b) => parseInt(a) - parseInt(b));

        let cardsHTML = matches.map(m => {
          const displayLabel = getMatchDisplayName(currentDept, currentRound, m);
          return `
            <div class="selection-card" onclick="selectMatch('${m}')">
              ${displayLabel}
              <div class="sub">結果を見る</div>
            </div>
          `;
        }).join('');

        view.innerHTML = `
          <h1>試合を選択してください</h1>
          <p class="subtitle">【${currentDept}部門 / ${currentRound}】の対戦カードを選択してください</p>
          <div class="card-grid">${cardsHTML}</div>
          <button class="btn-back" onclick="navTo('round')">← ラウンド選択に戻る</button>
        `;
        return;
      }

      renderResultView(view);
    }

    function selectDept(d) { currentDept = d; render(); }
    function selectRound(r) { currentRound = r; render(); }
    function selectMatch(m) { currentMatch = m; currentSongTab = 'final'; render(); }

    function renderResultView(view) {
      const matchRows = treeData[currentDept]?.[currentRound]?.[currentMatch] || [];
      const matchLabel = getMatchDisplayName(currentDept, currentRound, currentMatch);
      
      // データが存在しない（未入力）の場合
      if (matchRows.length === 0) {
        view.innerHTML = `
          <h1>${currentDept}部門 - ${currentRound} ${matchLabel}</h1>
          <div style="padding: 50px 20px; background: rgba(255, 255, 255, 0.08); border-radius: 12px; border: 1px dashed rgba(255, 255, 255, 0.2); margin-top: 20px;">
            <p style="font-size: 1.3rem; color: #b0b8d0; margin-bottom: 10px; font-weight: bold;">📭 データがありません</p>
            <p style="font-size: 0.95rem; color: #8a94ad; margin: 0;">この試合のリザルトデータはまだスプレッドシートに登録されていません。</p>
          </div>
          <button class="btn-back" onclick="navTo('match')">← 試合選択に戻る</button>
        `;
        return;
      }

      const isDoubles = currentDept.toUpperCase().includes("DOUBLES");
      const songMap = {};
      const teamScores = {};

      matchRows.forEach(r => {
        if (r.songNum) {
          if (r.songName) songMap[r.songNum] = r.songName;

          let entityName = r.name;
          if (isDoubles && r.name.includes("(")) {
            entityName = r.name.split("(")[0].trim();
          }

          if (!teamScores[entityName]) {
            teamScores[entityName] = { total: 0, songs: {}, p: 0, g: 0, gd: 0, b: 0, m: 0 };
          }
          
          teamScores[entityName].songs[r.songNum] = (teamScores[entityName].songs[r.songNum] || 0) + r.score;
          teamScores[entityName].total += r.score;

          teamScores[entityName].p += (parseInt(r.p, 10) || 0);
          teamScores[entityName].g += (parseInt(r.g, 10) || 0);
          teamScores[entityName].gd += (parseInt(r.gd, 10) || 0);
          teamScores[entityName].b += (parseInt(r.b, 10) || 0);
          teamScores[entityName].m += (parseInt(r.m, 10) || 0);
        }
      });

      // CSVにある全曲目番号、もしくはデータ上の1, 2, 3曲目を抽出してセット
      let csvSongNums = Object.keys(songMap);
      if (csvSongNums.length === 0) csvSongNums = ["1", "2", "3"];
      const songNums = Array.from(new Set([...csvSongNums])).sort((a,b) => a - b);

      // タブ生成：1曲目、2曲目、3曲目... ＋ 🏆 最終結果
      let tabsHTML = songNums.map(num => `
        <button class="tab-btn ${currentSongTab === num ? 'active' : ''}" onclick="switchTab('${num}')">
          ${num}曲目
        </button>
      `).join('');

      tabsHTML += `
        <button class="tab-btn ${currentSongTab === 'final' ? 'active' : ''}" onclick="switchTab('final')">
          🏆 最終結果
        </button>
      `;

      let tableHeader = "";
      let tableBody = "";

      if (currentSongTab === 'final') {
        tableHeader = `
          <tr>
            <th class="anim-item anim-base">順位</th>
            <th class="anim-item anim-base">${isDoubles ? 'チーム名' : 'プレイヤー名'}</th>
            <th class="p-perfect anim-item anim-p">PERFECT</th>
            <th class="p-great anim-item anim-g">GREAT</th>
            <th class="p-good anim-item anim-gd">GOOD</th>
            <th class="p-bad anim-item anim-b">BAD</th>
            <th class="p-miss anim-item anim-m">MISS</th>`;
        
        songNums.forEach(num => {
          const sName = songMap[num] ? `<small>${songMap[num]}</small>` : '';
          tableHeader += `<th class="anim-item anim-song">${num}曲目${sName}</th>`;
        });
        tableHeader += `<th class="anim-item anim-score">合計スコア</th></tr>`;

        const sorted = Object.keys(teamScores)
          .map(name => ({ name, ...teamScores[name] }))
          .sort((a, b) => b.total - a.total);

        tableBody = sorted.map((p, idx) => {
          const rank = idx + 1;
          let row = `
            <tr>
              <td class="${rank <= 3 ? 'rank-' + rank : ''} anim-item anim-base">${rank}位</td>
              <td class="anim-item anim-base"><b>${p.name}</b></td>
              <td class="p-perfect anim-item anim-p">${p.p.toLocaleString()}</td>
              <td class="p-great anim-item anim-g">${p.g.toLocaleString()}</td>
              <td class="p-good anim-item anim-gd">${p.gd.toLocaleString()}</td>
              <td class="p-bad anim-item anim-b">${p.b.toLocaleString()}</td>
              <td class="p-miss anim-item anim-m">${p.m.toLocaleString()}</td>
          `;

          songNums.forEach(num => {
            const sScore = p.songs[num] !== undefined ? p.songs[num].toLocaleString() : '-';
            row += `<td class="sub-score anim-item anim-song">${sScore}</td>`;
          });

          row += `<td class="score anim-item anim-score">${p.total.toLocaleString()}</td></tr>`;
          return row;
        }).join('');

      } else {
        tableHeader = `
          <tr>
            <th class="anim-item anim-base">順位</th>
            <th class="anim-item anim-base">${isDoubles ? 'チーム名 / プレイヤー名' : 'プレイヤー名'}</th>
            <th class="p-perfect anim-item anim-p">PERFECT</th>
            <th class="p-great anim-item anim-g">GREAT</th>
            <th class="p-good anim-item anim-gd">GOOD</th>
            <th class="p-bad anim-item anim-b">BAD</th>
            <th class="p-miss anim-item anim-m">MISS</th>
            <th class="anim-item anim-score">得点</th>
          </tr>`;

        const targetSongRows = matchRows.filter(r => String(r.songNum) === String(currentSongTab));
        const sorted = targetSongRows.sort((a, b) => b.score - a.score);

        tableBody = sorted.map((p, idx) => {
          const rank = idx + 1;
          return `
            <tr>
              <td class="${rank <= 3 ? 'rank-' + rank : ''} anim-item anim-base">${rank}位</td>
              <td class="anim-item anim-base"><b>${p.name}</b></td>
              <td class="p-perfect anim-item anim-p">${parseInt(p.p, 10).toLocaleString()}</td>
              <td class="p-great anim-item anim-g">${parseInt(p.g, 10).toLocaleString()}</td>
              <td class="p-good anim-item anim-gd">${parseInt(p.gd, 10).toLocaleString()}</td>
              <td class="p-bad anim-item anim-b">${parseInt(p.b, 10).toLocaleString()}</td>
              <td class="p-miss anim-item anim-m">${parseInt(p.m, 10).toLocaleString()}</td>
              <td class="score">${p.score.toLocaleString()}</td>
            </tr>
          `;
        }).join('');
      }

      view.innerHTML = `
        <h1>${currentDept}部門 - ${currentRound} ${matchLabel}</h1>
        <div class="tab-container">${tabsHTML}</div>
        <div class="anim-hint">⌨️ <b>Enterキー</b> を押すとアニメーション演出をいつでも再再生できます</div>
        <div class="table-container anim-active" id="table-box">
          <table>
            <thead>${tableHeader}</thead>
            <tbody>${tableBody}</tbody>
          </table>
        </div>
        <button class="btn-back" onclick="navTo('match')">← 試合選択に戻る</button>
      `;
    }

    function switchTab(tab) {
      currentSongTab = tab;
      render();
    }
  </script>
</body>
</html>
