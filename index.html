<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>大会リザルトシステム</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #f4f6f9;
      color: #333333;
      margin: 0; padding: 20px;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh;
    }

    /* CSV読み込みステータス */
    .status-bar {
      position: fixed; top: 10px; right: 10px;
      padding: 6px 12px; border-radius: 20px;
      font-size: 0.8rem; font-weight: bold;
      display: flex; align-items: center; gap: 6px;
      background: rgba(255, 255, 255, 0.9); border: 1px solid #ccc;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      z-index: 1000;
    }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #888; }
    .status-dot.ok { background: #00cc44; box-shadow: 0 0 6px #00cc44; }
    .status-dot.ng { background: #ff3333; box-shadow: 0 0 6px #ff3333; }

    /* 全体コンテナ */
    .container {
      width: 100%; max-width: 1000px;
      margin-top: 30px; text-align: center;
    }

    /* パンくずリスト */
    .breadcrumb {
      display: flex; justify-content: center; align-items: center; gap: 8px;
      margin-bottom: 20px; font-size: 0.95rem; color: #666666; flex-wrap: wrap;
    }
    .breadcrumb-item { cursor: pointer; text-decoration: underline; color: #0066cc; }
    .breadcrumb-item:hover { color: #003399; }
    .breadcrumb-current { color: #111111; font-weight: bold; }

    /* タイトルエリア */
    h1 { color: #111111; margin-bottom: 10px; }
    p.subtitle { color: #666666; margin-top: 0; margin-bottom: 25px; }

    /* カード・ボタン */
    .card-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px; margin-top: 20px;
    }
    .selection-card {
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 12px; padding: 25px 15px;
      font-size: 1.2rem; font-weight: bold; color: #111111;
      cursor: pointer; transition: all 0.2s ease;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .selection-card:hover {
      background: #f0f7ff; border-color: #0066cc; transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0, 102, 204, 0.15);
    }
    .selection-card.gold-card { border-color: #e6b800; background: #fffdf0; }
    .selection-card.gold-card:hover { background: #fff9d6; border-color: #d4a000; box-shadow: 0 5px 15px rgba(212, 160, 0, 0.2); }
    .selection-card .sub { font-size: 0.85rem; color: #666666; font-weight: normal; margin-top: 5px; }

    /* タブ切り替え */
    .tab-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .tab-btn {
      background: #ffffff; border: 1px solid #cccccc; color: #333333;
      padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s;
    }
    .tab-btn:hover { background: #e8f2ff; }
    .tab-btn.active { background: #0066cc; color: #ffffff; font-weight: bold; border-color: #0066cc; box-shadow: 0 2px 8px rgba(0, 102, 204, 0.3); }

    .anim-hint { font-size: 0.9rem; color: #0066cc; margin-bottom: 15px; font-weight: bold; }

    /* リザルトテーブル */
    .table-container {
      background: #ffffff; border-radius: 12px; border: 1px solid #e1e4e8;
      overflow-x: auto; margin-top: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    table { width: 100%; border-collapse: collapse; text-align: center; white-space: nowrap; }
    th, td { padding: 12px 16px; font-size: 0.95rem; border-bottom: 1px solid #e1e4e8; border-right: 1px solid #f0f0f0; }
    th:last-child, td:last-child { border-right: none; }
    
    .row-header { background: #f8fafc; font-weight: bold; color: #004499; text-align: right; width: 160px; }
    .player-header { background: #e8f2ff; color: #004499; font-size: 1.1rem; font-weight: bold; }

    /* ダブルスチーム用カラー分岐 */
    .team-col-0 { background: #f0f7ff !important; color: #0055bb !important; border-bottom: 2px solid #0066cc !important; }
    .team-col-1 { background: #fff5f0 !important; color: #cc4400 !important; border-bottom: 2px solid #ff6600 !important; }

    /* 指定された判定用カラー（プロセカALL PERFECTイメージのパステルレインボー） */
    .p-perfect {
      background: linear-gradient(135deg, #70f3ff 0%, #a8ffeb 25%, #ffffff 50%, #ffb8e7 75%, #d194ff 100%);
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      font-weight: 900;
      filter: drop-shadow(0px 1px 1px rgba(0,0,0,0.2));
    }
    .p-great { color: #e60073; font-weight: bold; } /* ピンク */
    .p-good { color: #00aaff; font-weight: bold; }  /* 水色 */
    .p-bad { color: #66cc00; font-weight: bold; }   /* 黄緑 */
    .p-miss { color: #888888; font-weight: bold; }  /* 灰色 */

    .score { font-family: monospace; font-size: 1.25rem; color: #006699; font-weight: bold; }
    .sub-score { font-family: monospace; font-size: 1.05rem; color: #333333; }
    
    /* 最高得点の強調 */
    .score-top {
      font-size: 1.6rem !important; color: #d4a000 !important; font-weight: 900 !important;
      text-shadow: 0 0 10px rgba(212, 160, 0, 0.5); transform: scale(1.08); display: inline-block;
    }

    .rank-1 { color: #d4a000; font-size: 1.3rem; font-weight: bold; }
    .rank-2 { color: #777777; font-size: 1.2rem; font-weight: bold; }
    .rank-3 { color: #b85c00; font-size: 1.1rem; font-weight: bold; }

    .score-box { position: relative; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 6px; }
    /* バッジ位置をさらに左側（left: -25px）に修正 */
    .badge-ap, .badge-fc {
      position: absolute; top: -6px; left: -25px;
      font-size: 0.72rem; font-weight: 900;
      transform: rotate(-12deg); pointer-events: none;
      white-space: nowrap;
    }
    .badge-ap {
      background: linear-gradient(135deg, #70f3ff 0%, #a8ffeb 25%, #ffffff 50%, #ffb8e7 75%, #d194ff 100%);
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      filter: drop-shadow(0 0 2px rgba(112, 243, 255, 0.6));
    }
    .badge-fc { color: #e60073; text-shadow: 0 0 2px #ffb3d9; }

    /* ダブルス 2人表示用カラー */
    .p1-tag { color: #0066cc; font-weight: bold; }
    .p2-tag { color: #cc0066; font-weight: bold; }
    .pair-container { display: flex; justify-content: center; gap: 12px; font-size: 0.9rem; }

    .btn-back { margin-top: 25px; background: #ffffff; border: 1px solid #cccccc; color: #555555; padding: 8px 20px; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
    .btn-back:hover { background: #f0f0f0; color: #111; }

    /* アニメーション用表示制御 */
    @keyframes dropIn { 0% { opacity: 0; transform: translateY(-8px); } 100% { opacity: 1; transform: translateY(0); } }
    .anim-target { opacity: 0; }
    .anim-visible { animation: dropIn 0.35s ease forwards; }
  </style>
</head>
<body>

  <div class="status-bar">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">CSV読み込み確認中...</span>
  </div>

  <div class="container">
    <div class="breadcrumb" id="breadcrumb"></div>
    <div id="view-area"></div>
  </div>

  <script>
    const ROUND_NAMES = { "QF": "準々決勝", "SF": "準決勝", "Final": "決勝" };
    const DEFAULT_STRUCTURE = {
      "STANDARD": { "準々決勝": [1], "準決勝": [1], "決勝": [1] },
      "NEXT": { "準々決勝": [1, 2, 3, 4], "準決勝": [1, 2], "決勝": [1] },
      "ULTIMATE": { "準々決勝": [1, 2], "準決勝": [1, 2], "決勝": [1] },
      "DOUBLES": { "準々決勝": [1, 2, 3, 4], "準決勝": [1, 2], "決勝": [1] }
    };
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSJ9mquQm_J8GBgOq2Qj_aHNJGLbCZTgIU4uK_GH0bjRSYwHbQ6xKLyATkmaTeNX3_6pqzy7XmHmowm/pub?gid=1560276695&single=true&output=csv"; 

    let treeData = {};
    let currentDept = null, currentRound = null, currentMatch = null, currentSongTab = null;
    let animStep = 0;

    fetchCSV();

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') triggerAnimation();
    });

    function triggerAnimation() {
      animStep++;
      const targets = document.querySelectorAll(`[data-anim-step="${animStep}"]`);
      if (targets.length > 0) {
        targets.forEach(el => el.classList.add('anim-visible'));
      }
    }

    async function fetchCSV() {
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      try {
        const res = await fetch(`${CSV_URL}&t=${new Date().getTime()}`);
        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
        const csvText = await res.text();
        parseCSV(csvText);
        dot.className = "status-dot ok"; text.innerText = "CSV読み込み完了";
      } catch (err) {
        dot.className = "status-dot ng"; text.innerText = "CSV読み込み失敗";
      }
      render();
    }

    function parseCSV(text) {
      const rows = text.trim().split(/\r?\n/).map(r => r.split(',').map(c => c ? c.replace(/"/g, '').trim() : ''));
      if (rows.length < 2) return;
      const header = rows[0];

      const idxDept = header.findIndex(h => h.includes('部門'));
      const idxRound = header.findIndex(h => h.includes('ラウンド'));
      const idxMatch = header.findIndex(h => h.includes('試合'));
      const idxSongNum = header.findIndex(h => h.includes('曲番号') || h.includes('曲目'));
      const idxSongName = header.findIndex(h => h.includes('曲名'));
      const idxName = header.findIndex(h => h.includes('プレイヤー') || h.includes('名前') || h.includes('チーム'));
      const idxP = header.findIndex(h => h.toUpperCase().includes('PERFECT'));
      const idxG = header.findIndex(h => h.toUpperCase().includes('GREAT'));
      const idxGd = header.findIndex(h => h.toUpperCase().includes('GOOD'));
      const idxB = header.findIndex(h => h.toUpperCase().includes('BAD'));
      const idxM = header.findIndex(h => h.toUpperCase().includes('MISS'));
      const idxScore = header.findIndex(h => h.includes('得点') || h.includes('スコア'));
      const idxFlg = header.findIndex(h => h.toUpperCase().includes('AP') || h.toUpperCase().includes('FC') || h.includes('FLG') || h.includes('フラグ'));

      treeData = {};

      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        const dept = (idxDept !== -1 && row[idxDept]) ? row[idxDept].toUpperCase().trim() : "共通";
        const rawRound = idxRound !== -1 ? row[idxRound] : "";
        const match = idxMatch !== -1 ? row[idxMatch] : "";
        const songNum = idxSongNum !== -1 ? row[idxSongNum] : "";
        const songName = idxSongName !== -1 ? row[idxSongName] : "";
        const name = idxName !== -1 ? row[idxName] : "";

        if (!rawRound || !match || !name) continue;

        const round = ROUND_NAMES[rawRound] || rawRound;
        const p = idxP !== -1 ? row[idxP] : "0";
        const g = idxG !== -1 ? row[idxG] : "0";
        const gd = idxGd !== -1 ? row[idxGd] : "0";
        const b = idxB !== -1 ? row[idxB] : "0";
        const m = idxM !== -1 ? row[idxM] : "0";
        const score = parseInt(idxScore !== -1 ? row[idxScore] : "0", 10) || 0;
        const flg = (idxFlg !== -1 && row[idxFlg]) ? row[idxFlg].toUpperCase().trim() : "";

        const targetDepts = (dept === "共通") ? ["STANDARD", "NEXT", "ULTIMATE", "DOUBLES"] : [dept];

        targetDepts.forEach(d => {
          if (!treeData[d]) treeData[d] = {};
          if (!treeData[d][round]) treeData[d][round] = {};
          if (!treeData[d][round][match]) treeData[d][round][match] = [];
          treeData[d][round][match].push({ songNum, songName, name, p, g, gd, b, m, score, flg });
        });
      }
    }

    function getMatchDisplayName(dept, round, matchNum) {
      if (dept === 'ULTIMATE' && round === '準々決勝') {
        if (String(matchNum) === '1') return 'GroupA';
        if (String(matchNum) === '2') return 'GroupB';
      }
      return `第${matchNum}試合`;
    }

    function renderScoreCell(score, flg, isTop = false, showFlg = true) {
      const formattedScore = score.toLocaleString();
      let badgeHTML = '';
      if (showFlg) {
        if (flg === "AP" || flg === "ALL PERFECT") badgeHTML = `<span class="badge-ap">ALL PERFECT</span>`;
        else if (flg === "FC" || flg === "FULL COMBO") badgeHTML = `<span class="badge-fc">FULL COMBO</span>`;
      }
      const topClass = isTop ? 'score-top' : '';
      return `<div class="score-box ${topClass}">${badgeHTML}<span>${formattedScore}</span></div>`;
    }

    function calculateRanks(scores) {
      const sorted = [...scores].sort((a, b) => b - a);
      const rankMap = new Map();
      sorted.forEach((score, index) => { if (!rankMap.has(score)) rankMap.set(score, index + 1); });
      return rankMap;
    }

    function renderBreadcrumb() {
      const nav = document.getElementById('breadcrumb');
      let html = `<span class="breadcrumb-item" onclick="navTo('dept')">TOP (部門選択)</span>`;
      if (currentDept) html += ` ＞ ` + (currentRound ? `<span class="breadcrumb-item" onclick="navTo('round')">${currentDept}</span>` : `<span class="breadcrumb-current">${currentDept}</span>`);
      if (currentRound) html += ` ＞ ` + (currentMatch ? `<span class="breadcrumb-item" onclick="navTo('match')">${currentRound}</span>` : `<span class="breadcrumb-current">${currentRound}</span>`);
      if (currentMatch) {
        const matchLabel = getMatchDisplayName(currentDept, currentRound, currentMatch);
        html += ` ＞ ` + (currentSongTab !== null ? `<span class="breadcrumb-item" onclick="navTo('song')">${matchLabel}</span>` : `<span class="breadcrumb-current">${matchLabel}</span>`);
      }
      if (currentSongTab !== null) {
        html += ` ＞ <span class="breadcrumb-current">${currentSongTab === 'final' ? '🏆 最終結果' : `${currentSongTab}曲目`}</span>`;
      }
      nav.innerHTML = html;
    }

    function navTo(level) {
      if (level === 'dept') { currentDept = currentRound = currentMatch = currentSongTab = null; }
      else if (level === 'round') { currentRound = currentMatch = currentSongTab = null; }
      else if (level === 'match') { currentMatch = currentSongTab = null; }
      else if (level === 'song') { currentSongTab = null; }
      render();
    }

    function render() {
      renderBreadcrumb();
      const view = document.getElementById('view-area');

      if (!currentDept) {
        const depts = Array.from(new Set([...Object.keys(DEFAULT_STRUCTURE), ...Object.keys(treeData)]));
        view.innerHTML = `<h1>部門を選択してください</h1><p class="subtitle">表示したい部門を選択して次へ進みます</p>
          <div class="card-grid">${depts.map(d => `<div class="selection-card" onclick="selectDept('${d}')">${d} 部門<div class="sub">クリックして決定</div></div>`).join('')}</div>`;
        return;
      }

      if (!currentRound) {
        const rounds = Array.from(new Set([...(DEFAULT_STRUCTURE[currentDept] ? Object.keys(DEFAULT_STRUCTURE[currentDept]) : []), ...(treeData[currentDept] ? Object.keys(treeData[currentDept]) : [])]));
        view.innerHTML = `<h1>ラウンドを選択してください</h1><p class="subtitle">【${currentDept}部門】のラウンドを選択してください</p>
          <div class="card-grid">${rounds.map(r => `<div class="selection-card" onclick="selectRound('${r}')">${r}<div class="sub">クリックして決定</div></div>`).join('')}</div>
          <button class="btn-back" onclick="navTo('dept')">← 部門選択に戻る</button>`;
        return;
      }

      if (!currentMatch) {
        const matches = Array.from(new Set([...(DEFAULT_STRUCTURE[currentDept]?.[currentRound]?.map(String) || []), ...(treeData[currentDept]?.[currentRound] ? Object.keys(treeData[currentDept][currentRound]) : [])])).sort((a,b) => parseInt(a) - parseInt(b));
        view.innerHTML = `<h1>試合を選択してください</h1><p class="subtitle">【${currentDept}部門 / ${currentRound}】の対戦カードを選択してください</p>
          <div class="card-grid">${matches.map(m => `<div class="selection-card" onclick="selectMatch('${m}')">${getMatchDisplayName(currentDept, currentRound, m)}<div class="sub">結果表示へ進む</div></div>`).join('')}</div>
          <button class="btn-back" onclick="navTo('round')">← ラウンド選択に戻る</button>`;
        return;
      }

      if (currentSongTab === null) {
        const matchRows = treeData[currentDept]?.[currentRound]?.[currentMatch] || [];
        if (matchRows.length === 0) {
          view.innerHTML = `<h1>${currentDept}部門 - ${currentRound} ${getMatchDisplayName(currentDept, currentRound, currentMatch)}</h1>
            <div style="padding: 50px 20px; background: #ffffff; border-radius: 12px; border: 1px dashed #cccccc; margin-top: 20px;">
              <p style="font-size: 1.3rem; color: #666666; margin-bottom: 10px; font-weight: bold;">📭 データがありません</p>
            </div><button class="btn-back" onclick="navTo('match')">← 試合選択に戻る</button>`;
          return;
        }

        let songCardsHTML = ["1", "2", "3"].map(num => `<div class="selection-card" onclick="selectSongTab('${num}')">${num}曲目<div class="sub">${num}曲目のスコア結果</div></div>`).join('');
        songCardsHTML += `<div class="selection-card gold-card" onclick="selectSongTab('final')">🏆 最終結果<div class="sub">総合スコア・最終順位</div></div>`;

        view.innerHTML = `<h1>表示する結果を選択してください</h1><p class="subtitle">【${currentDept}部門 / ${currentRound} ${getMatchDisplayName(currentDept, currentRound, currentMatch)}】</p>
          <div class="card-grid">${songCardsHTML}</div><button class="btn-back" onclick="navTo('match')">← 試合選択に戻る</button>`;
        return;
      }

      renderResultView(view);
    }

    function selectDept(d) { currentDept = d; render(); }
    function selectRound(r) { currentRound = r; render(); }
    function selectMatch(m) { currentMatch = m; currentSongTab = null; render(); }
    function selectSongTab(tab) { currentSongTab = tab; animStep = 0; render(); }

    function renderResultView(view) {
      const matchRows = treeData[currentDept]?.[currentRound]?.[currentMatch] || [];
      const matchLabel = getMatchDisplayName(currentDept, currentRound, currentMatch);
      const isDoubles = currentDept.toUpperCase().includes("DOUBLES");

      const songMap = {};
      const teamOrder = [];
      const teamData = {};
      const csvFinalRows = {};

      matchRows.forEach(r => {
        let teamName = r.name;
        let pName = "";
        if (isDoubles && r.name.includes("(")) {
          const parts = r.name.split("(");
          teamName = parts[0].trim();
          pName = parts[1].replace(")", "").trim();
        }

        if (!teamData[teamName]) {
          teamOrder.push(teamName);
          teamData[teamName] = { total: 0, songs: {}, flgs: {}, members: {}, p: 0, g: 0, gd: 0, b: 0, m: 0 };
        }

        if (r.songNum === "合計" || r.songNum === "最終結果" || r.songNum === "total") {
          csvFinalRows[teamName] = r;
          return;
        }

        if (r.songNum) {
          if (r.songName) songMap[r.songNum] = r.songName;

          teamData[teamName].songs[r.songNum] = (teamData[teamName].songs[r.songNum] || 0) + r.score;
          teamData[teamName].flgs[r.songNum] = r.flg;
          teamData[teamName].total += r.score;

          teamData[teamName].p += (parseInt(r.p, 10) || 0);
          teamData[teamName].g += (parseInt(r.g, 10) || 0);
          teamData[teamName].gd += (parseInt(r.gd, 10) || 0);
          teamData[teamName].b += (parseInt(r.b, 10) || 0);
          teamData[teamName].m += (parseInt(r.m, 10) || 0);

          if (isDoubles && r.songNum === "3" && pName) {
            if (!teamData[teamName].members[pName]) teamData[teamName].members[pName] = { p: 0, g: 0, gd: 0, b: 0, m: 0, score: 0 };
            teamData[teamName].members[pName] = { p: r.p, g: r.g, gd: r.gd, b: r.b, m: r.m, score: r.score };
          }
        }
      });

      const songNums = ["1", "2", "3"];
      let tabsHTML = songNums.map(num => `<button class="tab-btn ${currentSongTab === num ? 'active' : ''}" onclick="selectSongTab('${num}')">${num}曲目</button>`).join('') +
        `<button class="tab-btn ${currentSongTab === 'final' ? 'active' : ''}" onclick="selectSongTab('final')">🏆 最終結果</button>`;

      let tableHTML = "";

      if (currentSongTab === 'final') {
        let allTotals = [];
        if (isDoubles && Object.keys(csvFinalRows).length > 0) {
          allTotals = teamOrder.map(n => csvFinalRows[n] ? csvFinalRows[n].score : teamData[n].total);
        } else {
          allTotals = teamOrder.map(n => teamData[n].total);
        }

        const maxScore = Math.max(...allTotals);
        const rankMap = calculateRanks(allTotals);

        let headerRow = `<tr><th class="row-header">${isDoubles ? 'チーム' : '項目 / プレイヤー'}</th>` +
          teamOrder.map((name, idx) => `<th class="player-header ${isDoubles ? 'team-col-' + (idx % 2) : ''}">${name}</th>`).join('') + `</tr>`;

        let songRows = songNums.map((num, idx) => {
          const sName = songMap[num] ? `<br><small style="font-weight:normal; color:#555;">（${songMap[num]}）</small>` : '';
          let row = `<tr><td class="row-header">${num}曲目${sName}</td>`;
          teamOrder.forEach(n => {
            const sScore = teamData[n].songs[num] !== undefined ? teamData[n].songs[num] : 0;
            const sFlg = teamData[n].flgs[num] || "";
            const cellContent = teamData[n].songs[num] !== undefined ? renderScoreCell(sScore, sFlg, false, true) : '-';
            row += `<td class="sub-score anim-target" data-anim-step="${idx + 1}">${cellContent}</td>`;
          });
          return row + `</tr>`;
        }).join('');

        let summaryRows = "";
        if (isDoubles) {
          const getVal = (n, key) => (csvFinalRows[n] ? csvFinalRows[n][key] : teamData[n][key]).toLocaleString();
          summaryRows += `<tr><td class="row-header p-perfect">PERFECT 合計</td>` + teamOrder.map(n => `<td class="p-perfect anim-target" data-anim-step="4">${getVal(n, 'p')}</td>`).join('') + `</tr>`;
          summaryRows += `<tr><td class="row-header p-great">GREAT 合計</td>` + teamOrder.map(n => `<td class="p-great anim-target" data-anim-step="4">${getVal(n, 'g')}</td>`).join('') + `</tr>`;
          summaryRows += `<tr><td class="row-header p-good">GOOD 合計</td>` + teamOrder.map(n => `<td class="p-good anim-target" data-anim-step="4">${getVal(n, 'gd')}</td>`).join('') + `</tr>`;
          summaryRows += `<tr><td class="row-header p-bad">BAD 合計</td>` + teamOrder.map(n => `<td class="p-bad anim-target" data-anim-step="4">${getVal(n, 'b')}</td>`).join('') + `</tr>`;
          summaryRows += `<tr><td class="row-header p-miss">MISS 合計</td>` + teamOrder.map(n => `<td class="p-miss anim-target" data-anim-step="4">${getVal(n, 'm')}</td>`).join('') + `</tr>`;
        }

        const totalStepNum = isDoubles ? 5 : 4;
        let totalRow = `<tr><td class="row-header" style="font-size:1.1rem; color:#006699;">合計得点</td>` + teamOrder.map(n => {
          const finalScore = csvFinalRows[n] ? csvFinalRows[n].score : teamData[n].total;
          const isWinner = finalScore === maxScore && maxScore > 0;
          return `<td class="score anim-target" data-anim-step="${totalStepNum}">${renderScoreCell(finalScore, "", isWinner, false)}</td>`;
        }).join('') + `</tr>`;

        let rankRow = `<tr><td class="row-header" style="font-size:1.1rem; color:#111;">順位</td>` + teamOrder.map(n => {
          const finalScore = csvFinalRows[n] ? csvFinalRows[n].score : teamData[n].total;
          const rank = rankMap.get(finalScore);
          return `<td class="${rank <= 3 ? 'rank-' + rank : ''} anim-target" data-anim-step="${totalStepNum}">${rank}位</td>`;
        }).join('') + `</tr>`;

        tableHTML = `<thead>${headerRow}</thead><tbody>${songRows}${summaryRows}${totalRow}${rankRow}</tbody>`;

      } else {
        const targetSongRows = matchRows.filter(r => String(r.songNum) === String(currentSongTab));
        const currentSongName = songMap[currentSongTab] ? `（${songMap[currentSongTab]}）` : '';
        const maxScore = targetSongRows.length > 0 ? Math.max(...targetSongRows.map(r => r.score)) : -1;

        let headerRow = `<tr><th class="row-header">${isDoubles ? 'チーム' : '項目 / プレイヤー'}<br><small style="font-weight:normal;">${currentSongName}</small></th>` +
          teamOrder.map((name, idx) => `<th class="player-header ${isDoubles ? 'team-col-' + (idx % 2) : ''}">${name}</th>`).join('') + `</tr>`;

        const getValHTML = (n, key) => {
          if (isDoubles && currentSongTab === "3") {
            const mKeys = Object.keys(teamData[n].members);
            if (mKeys.length >= 2) {
              const p1Val = teamData[n].members[mKeys[0]][key];
              const p2Val = teamData[n].members[mKeys[1]][key];
              return `<div class="pair-container"><span class="p1-tag">${p1Val}</span><span>/</span><span class="p2-tag">${p2Val}</span></div>`;
            }
          }
          const rowData = targetSongRows.find(r => r.name.includes(n));
          return rowData ? parseInt(rowData[key], 10).toLocaleString() : '-';
        };

        let pRow = `<tr class="anim-target" data-anim-step="1"><td class="row-header p-perfect">PERFECT</td>` + teamOrder.map(n => `<td class="p-perfect">${getValHTML(n, 'p')}</td>`).join('') + `</tr>`;
        let gRow = `<tr class="anim-target" data-anim-step="1"><td class="row-header p-great">GREAT</td>` + teamOrder.map(n => `<td class="p-great">${getValHTML(n, 'g')}</td>`).join('') + `</tr>`;
        let gdRow = `<tr class="anim-target" data-anim-step="1"><td class="row-header p-good">GOOD</td>` + teamOrder.map(n => `<td class="p-good">${getValHTML(n, 'gd')}</td>`).join('') + `</tr>`;
        let bRow = `<tr class="anim-target" data-anim-step="1"><td class="row-header p-bad">BAD</td>` + teamOrder.map(n => `<td class="p-bad">${getValHTML(n, 'b')}</td>`).join('') + `</tr>`;
        let mRow = `<tr class="anim-target" data-anim-step="1"><td class="row-header p-miss">MISS</td>` + teamOrder.map(n => `<td class="p-miss">${getValHTML(n, 'm')}</td>`).join('') + `</tr>`;

        let scoreRow = `<tr class="anim-target" data-anim-step="1"><td class="row-header" style="font-size:1.1rem; color:#006699;">得点</td>` + teamOrder.map(n => {
          const rowData = targetSongRows.find(r => r.name.includes(n));
          if (!rowData) return `<td class="score">-</td>`;
          const isTop = rowData.score === maxScore && maxScore > 0;
          return `<td class="score">${renderScoreCell(rowData.score, rowData.flg, isTop, true)}</td>`;
        }).join('') + `</tr>`;

        tableHTML = `<thead>${headerRow}</thead><tbody>${pRow}${gRow}${gdRow}${bRow}${mRow}${scoreRow}</tbody>`;
      }

      view.innerHTML = `
        <h1>${currentDept}部門 - ${currentRound} ${matchLabel}</h1>
        <div class="tab-container">${tabsHTML}</div>
        <div class="anim-hint">⌨️ <b>Enterキー</b> を押すと結果が表示されます</div>
        <div class="table-container" id="table-box"><table>${tableHTML}</table></div>
        <button class="btn-back" onclick="navTo('song')">← 結果選択に戻る</button>
      `;
    }
  </script>
</body>
</html>
