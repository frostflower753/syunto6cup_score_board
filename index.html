<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>大会リザルトシステム</title>
  <style>
    * { box-sizing: border-box; }
    
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #f4f6f9;
      color: #333333;
    }

    .container {
      width: 100%;
      height: 100%;
      max-width: 1920px;
      margin: 0 auto;
      padding: 40px 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .breadcrumb {
      display: flex; justify-content: center; align-items: center; gap: 10px;
      margin-bottom: 20px; font-size: 1.1rem; color: #666666;
    }
    .breadcrumb-item { cursor: pointer; text-decoration: underline; color: #0066cc; }
    .breadcrumb-item:hover { color: #003399; }
    .breadcrumb-current { color: #111111; font-weight: bold; }

    h1 { color: #111111; font-size: 2.2rem; margin: 0 0 10px 0; text-align: center; }
    p.subtitle { color: #666666; font-size: 1.1rem; margin: 0 0 30px 0; text-align: center; }

    .card-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 24px;
      width: 100%;
      max-width: 1400px;
    }
    .selection-card {
      width: 300px;
      height: 140px;
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 12px;
      font-size: 1.4rem; font-weight: bold; color: #111111;
      cursor: pointer; transition: all 0.2s ease;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
    }
    .selection-card:hover {
      background: #f0f7ff; border-color: #0066cc; transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 102, 204, 0.15);
    }
    .selection-card.gold-card { border-color: #e6b800; background: #fffdf0; }
    .selection-card.gold-card:hover { background: #fff9d6; border-color: #d4a000; box-shadow: 0 8px 20px rgba(212, 160, 0, 0.2); }
    .selection-card .sub { font-size: 0.95rem; color: #666666; font-weight: normal; margin-top: 8px; }

    .tab-container { display: flex; justify-content: center; gap: 12px; margin-bottom: 15px; }
    .tab-btn {
      background: #ffffff; border: 1px solid #cccccc; color: #333333;
      padding: 10px 24px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; transition: all 0.2s;
    }
    .tab-btn:hover { background: #e8f2ff; }
    .tab-btn.active { background: #0066cc; color: #ffffff; font-weight: bold; border-color: #0066cc; box-shadow: 0 3px 10px rgba(0, 102, 204, 0.3); }

    .song-title-banner {
      font-size: 1.8rem; font-weight: bold; color: #111111;
      margin-bottom: 15px; letter-spacing: 0.5px; text-align: center;
    }

    .table-container {
      background: #ffffff; border-radius: 14px; border: 1px solid #e1e4e8;
      overflow: hidden; width: 100%; max-width: 1600px; box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    }
    table { width: 100%; border-collapse: collapse; text-align: center; white-space: nowrap; table-layout: fixed; }
    th, td { padding: 12px 10px; font-size: 1.15rem; border-bottom: 1px solid #e1e4e8; border-right: 1px solid #f0f0f0; }
    th:last-child, td:last-child { border-right: none; }
    
    .row-header { background: #f8fafc; font-weight: bold; color: #004499; text-align: right; width: 220px; font-size: 1.15rem; }
    .player-header { background: #e8f2ff; color: #004499; font-size: 1.3rem; font-weight: bold; }

    /* DOUBLES専用カラー（青・橙） */
    .team-blue { background: #f0f7ff !important; color: #0055bb !important; border-bottom: 2px solid #0066cc !important; }
    .team-orange { background: #fff5f0 !important; color: #cc4400 !important; border-bottom: 2px solid #ff6600 !important; }

    /* 高コントラスト判定カラー */
    .p-perfect { color: #0077cc; font-weight: 900; font-size: 1.25rem; }
    .p-great { color: #d0006f; font-weight: bold; font-size: 1.2rem; }
    .p-good { color: #008800; font-weight: bold; font-size: 1.2rem; }
    .p-bad { color: #dd6600; font-weight: bold; font-size: 1.2rem; }
    .p-miss { color: #555555; font-weight: bold; font-size: 1.2rem; }

    .score { font-family: monospace; font-size: 1.5rem; color: #006699; font-weight: bold; }
    .sub-score { font-family: monospace; font-size: 1.25rem; color: #333333; }
    
    .score-top {
      font-size: 1.8rem !important; color: #d4a000 !important; font-weight: 900 !important;
      text-shadow: 0 0 10px rgba(212, 160, 0, 0.3); transform: scale(1.08); display: inline-block;
    }

    .rank-1 { color: #d4a000; font-size: 1.5rem; font-weight: bold; }
    .rank-2 { color: #777777; font-size: 1.35rem; font-weight: bold; }
    .rank-3 { color: #b85c00; font-size: 1.25rem; font-weight: bold; }

    .score-box { position: relative; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; }
    .badge-ap, .badge-fc {
      position: absolute; top: -12px; left: -28px;
      font-size: 0.75rem; font-weight: 900;
      transform: rotate(-12deg); pointer-events: none;
      white-space: nowrap;
    }
    .badge-ap {
      color: #0077cc;
      filter: drop-shadow(0 0 2px rgba(0, 119, 204, 0.4));
    }
    .badge-fc { color: #d0006f; }

    .btn-back { margin-top: 30px; background: #ffffff; border: 1px solid #cccccc; color: #555555; padding: 10px 30px; font-size: 1rem; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
    .btn-back:hover { background: #f0f0f0; color: #111; }

    /* アニメーション */
    @keyframes dropIn { 0% { opacity: 0; transform: translateY(-6px); } 100% { opacity: 1; transform: translateY(0); } }
    .anim-target { opacity: 0; display: inline-block; visibility: hidden; }
    .anim-visible { animation: dropIn 0.3s ease forwards; visibility: visible; }
  </style>
</head>
<body>

  <div class="container">
    <div class="breadcrumb" id="breadcrumb"></div>
    <div id="view-area" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
  </div>

  <script>
    const ROUND_NAMES = { "QF": "準々決勝", "SF": "準決勝", "Final": "決勝" };
    const DEFAULT_STRUCTURE = {
      "STANDARD": { "準々決勝": [1], "準決勝": [1], "決勝": [1] },
      "NEXT": { "準々決勝": [1, 2, 3, 4], "準決勝": [1, 2], "決勝": [1] },
      "ULTIMATE": { "準々決勝": [1, 2], "準決勝": [1, 2], "決勝": [1] },
      "DOUBLES": { "準々決勝": [1, 2, 3, 4], "準決勝": [1, 2], "決勝": [1] }
    };
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSJ9mquQm_J8GBgOq2Qj_aHNJGLbCZTgIU4uK_GH0bjRSYwHbQ6xKLyATkmaTeNX3_6pqzy7XmHmowm/pub?gid=1560276695&single=true&output=csv"; 

    let treeData = {};
    let currentDept = null, currentRound = null, currentMatch = null, currentSongTab = null;
    let animStep = 0;

    fetchCSV();

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') triggerAnimation();
    });

    function triggerAnimation() {
      animStep++;
      const targets = document.querySelectorAll(`[data-anim-step="${animStep}"]`);
      if (targets.length > 0) {
        targets.forEach(el => el.classList.add('anim-visible'));
      }
    }

    async function fetchCSV() {
      try {
        const res = await fetch(`${CSV_URL}&t=${new Date().getTime()}`);
        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
        const csvText = await res.text();
        parseCSV(csvText);
      } catch (err) {
        console.error("CSV fetch error:", err);
      }
      render();
    }

    function parseCSV(text) {
      const rows = text.trim().split(/\r?\n/).map(r => r.split(',').map(c => c ? c.replace(/"/g, '').trim() : ''));
      if (rows.length < 2) return;
      const header = rows[0];

      const idxDept = header.findIndex(h => h.includes('部門'));
      const idxRound = header.findIndex(h => h.includes('ラウンド'));
      const idxMatch = header.findIndex(h => h.includes('試合'));
      const idxSongNum = header.findIndex(h => h.includes('曲番号') || h.includes('曲目'));
      const idxSongName = header.findIndex(h => h.includes('曲名'));
      const idxName = header.findIndex(h => h.includes('プレイヤー') || h.includes('名前') || h.includes('チーム'));
      const idxP = header.findIndex(h => h.toUpperCase().includes('PERFECT'));
      const idxG = header.findIndex(h => h.toUpperCase().includes('GREAT'));
      const idxGd = header.findIndex(h => h.toUpperCase().includes('GOOD'));
      const idxB = header.findIndex(h => h.toUpperCase().includes('BAD'));
      const idxM = header.findIndex(h => h.toUpperCase().includes('MISS'));
      const idxScore = header.findIndex(h => h.includes('得点') || h.includes('スコア'));
      const idxFlg = header.findIndex(h => h.toUpperCase().includes('AP') || h.toUpperCase().includes('FC') || h.includes('FLG') || h.includes('フラグ'));

      treeData = {};

      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        const dept = (idxDept !== -1 && row[idxDept]) ? row[idxDept].toUpperCase().trim() : "共通";
        const rawRound = idxRound !== -1 ? row[idxRound] : "";
        const match = idxMatch !== -1 ? row[idxMatch] : "";
        const songNum = idxSongNum !== -1 ? row[idxSongNum] : "";
        const songName = idxSongName !== -1 ? row[idxSongName] : "";
        const name = idxName !== -1 ? row[idxName] : "";

        if (!rawRound || !match || !name) continue;

        const round = ROUND_NAMES[rawRound] || rawRound;
        const p = idxP !== -1 ? row[idxP] : "0";
        const g = idxG !== -1 ? row[idxG] : "0";
        const gd = idxGd !== -1 ? row[idxGd] : "0";
        const b = idxB !== -1 ? row[idxB] : "0";
        const m = idxM !== -1 ? row[idxM] : "0";
        const score = parseInt(idxScore !== -1 ? row[idxScore] : "0", 10) || 0;
        const flg = (idxFlg !== -1 && row[idxFlg]) ? row[idxFlg].toUpperCase().trim() : "";

        const targetDepts = (dept === "共通") ? ["STANDARD", "NEXT", "ULTIMATE", "DOUBLES"] : [dept];

        targetDepts.forEach(d => {
          if (!treeData[d]) treeData[d] = {};
          if (!treeData[d][round]) treeData[d][round] = {};
          if (!treeData[d][round][match]) treeData[d][round][match] = [];
          treeData[d][round][match].push({ songNum, songName, name, p, g, gd, b, m, score, flg });
        });
      }
    }

    function getMatchDisplayName(dept, round, matchNum) {
      if (dept === 'ULTIMATE' && round === '準々決勝') {
        if (String(matchNum) === '1') return 'GroupA';
        if (String(matchNum) === '2') return 'GroupB';
      }
      return `第${matchNum}試合`;
    }

    function renderScoreCell(score, flg, isTop = false, showFlg = true) {
      const formattedScore = score.toLocaleString();
      let badgeHTML = '';
      if (showFlg) {
        if (flg === "AP" || flg === "ALL PERFECT") badgeHTML = `<span class="badge-ap">ALL PERFECT</span>`;
        else if (flg === "FC" || flg === "FULL COMBO") badgeHTML = `<span class="badge-fc">FULL COMBO</span>`;
      }
      const topClass = isTop ? 'score-top' : '';
      return `<div class="score-box ${topClass}">${badgeHTML}<span>${formattedScore}</span></div>`;
    }

    function calculateRanks(scores) {
      const sorted = [...scores].sort((a, b) => b - a);
      const rankMap = new Map();
      sorted.forEach((score, index) => { if (!rankMap.has(score)) rankMap.set(score, index + 1); });
      return rankMap;
    }

    function renderBreadcrumb() {
      const nav = document.getElementById('breadcrumb');
      let html = `<span class="breadcrumb-item" onclick="navTo('dept')">TOP (部門選択)</span>`;
      if (currentDept) html += ` ＞ ` + (currentRound ? `<span class="breadcrumb-item" onclick="navTo('round')">${currentDept}</span>` : `<span class="breadcrumb-current">${currentDept}</span>`);
      if (currentRound) html += ` ＞ ` + (currentMatch ? `<span class="breadcrumb-item" onclick="navTo('match')">${currentRound}</span>` : `<span class="breadcrumb-current">${currentRound}</span>`);
      if (currentMatch) {
        const matchLabel = getMatchDisplayName(currentDept, currentRound, currentMatch);
        html += ` ＞ ` + (currentSongTab !== null ? `<span class="breadcrumb-item" onclick="navTo('song')">${matchLabel}</span>` : `<span class="breadcrumb-current">${matchLabel}</span>`);
      }
      if (currentSongTab !== null) {
        html += ` ＞ <span class="breadcrumb-current">${currentSongTab === 'final' ? '最終結果' : `${currentSongTab}曲目`}</span>`;
      }
      nav.innerHTML = html;
    }

    function navTo(level) {
      animStep = 0;
      if (level === 'dept') { currentDept = currentRound = currentMatch = currentSongTab = null; }
      else if (level === 'round') { currentRound = currentMatch = currentSongTab = null; }
      else if (level === 'match') { currentMatch = currentSongTab = null; }
      else if (level === 'song') { currentSongTab = null; }
      render();
    }

    function render() {
      renderBreadcrumb();
      const view = document.getElementById('view-area');

      if (!currentDept) {
        const depts = Array.from(new Set([...Object.keys(DEFAULT_STRUCTURE), ...Object.keys(treeData)]));
        view.innerHTML = `<h1>部門を選択してください</h1><p class="subtitle">表示したい部門を選択して次へ進みます</p>
          <div class="card-grid">${depts.map(d => `<div class="selection-card" onclick="selectDept('${d}')">${d} 部門<div class="sub">クリックして決定</div></div>`).join('')}</div>`;
        return;
      }

      if (!currentRound) {
        const rounds = Array.from(new Set([...(DEFAULT_STRUCTURE[currentDept] ? Object.keys(DEFAULT_STRUCTURE[currentDept]) : []), ...(treeData[currentDept] ? Object.keys(treeData[currentDept]) : [])]));
        view.innerHTML = `<h1>ラウンドを選択してください</h1><p class="subtitle">【${currentDept}部門】のラウンドを選択してください</p>
          <div class="card-grid">${rounds.map(r => `<div class="selection-card" onclick="selectRound('${r}')">${r}<div class="sub">クリックして決定</div></div>`).join('')}</div>
          <button class="btn-back" onclick="navTo('dept')">← 部門選択に戻る</button>`;
        return;
      }

      if (!currentMatch) {
        const matches = Array.from(new Set([...(DEFAULT_STRUCTURE[currentDept]?.[currentRound]?.map(String) || []), ...(treeData[currentDept]?.[currentRound] ? Object.keys(treeData[currentDept][currentRound]) : [])])).sort((a,b) => parseInt(a) - parseInt(b));
        view.innerHTML = `<h1>試合を選択してください</h1><p class="subtitle">【${currentDept}部門 / ${currentRound}】の対戦カードを選択してください</p>
          <div class="card-grid">${matches.map(m => `<div class="selection-card" onclick="selectMatch('${m}')">${getMatchDisplayName(currentDept, currentRound, m)}<div class="sub">結果表示へ進む</div></div>`).join('')}</div>
          <button class="btn-back" onclick="navTo('round')">← ラウンド選択に戻る</button>`;
        return;
      }

      if (currentSongTab === null) {
        const matchRows = treeData[currentDept]?.[currentRound]?.[currentMatch] || [];
        if (matchRows.length === 0) {
          view.innerHTML = `<h1>${currentDept}部門 - ${currentRound} ${getMatchDisplayName(currentDept, currentRound, currentMatch)}</h1>
            <div style="padding: 50px 20px; background: #ffffff; border-radius: 12px; border: 1px dashed #cccccc; margin-top: 20px; width:100%; max-width:800px; text-align:center;">
              <p style="font-size: 1.3rem; color: #666666; margin: 0; font-weight: bold;">データがありません</p>
            </div><button class="btn-back" onclick="navTo('match')">← 試合選択に戻る</button>`;
          return;
        }

        let songCardsHTML = ["1", "2", "3"].map(num => `<div class="selection-card" onclick="selectSongTab('${num}')">${num}曲目<div class="sub">${num}曲目のスコア結果</div></div>`).join('');
        songCardsHTML += `<div class="selection-card gold-card" onclick="selectSongTab('final')">最終結果<div class="sub">総合スコア・最終順位</div></div>`;

        view.innerHTML = `<h1>表示する結果を選択してください</h1><p class="subtitle">【${currentDept}部門 / ${currentRound} ${getMatchDisplayName(currentDept, currentRound, currentMatch)}】</p>
          <div class="card-grid">${songCardsHTML}</div><button class="btn-back" onclick="navTo('match')">← 試合選択に戻る</button>`;
        return;
      }

      renderResultView(view);
    }

    function selectDept(d) { currentDept = d; animStep = 0; render(); }
    function selectRound(r) { currentRound = r; animStep = 0; render(); }
    function selectMatch(m) { currentMatch = m; currentSongTab = null; animStep = 0; render(); }
    function selectSongTab(tab) { currentSongTab = tab; animStep = 0; render(); }

    function renderResultView(view) {
      animStep = 0;
      const matchRows = treeData[currentDept]?.[currentRound]?.[currentMatch] || [];
      const matchLabel = getMatchDisplayName(currentDept, currentRound, currentMatch);
      const isDoubles = currentDept.toUpperCase().includes("DOUBLES");

      const songMap = {};
      const teamOrder = [];
      const teamData = {};
      const csvFinalRows = {};

      matchRows.forEach(r => {
        let teamName = r.name;
        let pName = "";
        if (isDoubles && r.name.includes("(")) {
          const parts = r.name.split("(");
          teamName = parts[0].trim();
          pName = parts[1].replace(")", "").trim();
        }

        if (!teamData[teamName]) {
          teamOrder.push(teamName);
          teamData[teamName] = { total: 0, songs: {}, flgs: {}, members: {}, songDetails: {}, p: 0, g: 0, gd: 0, b: 0, m: 0 };
        }

        if (r.songNum === "合計" || r.songNum === "最終結果" || r.songNum === "total") {
          csvFinalRows[teamName] = r;
          return;
        }

        if (r.songNum) {
          if (r.songName) songMap[r.songNum] = r.songName;

          if (!teamData[teamName].songDetails[r.songNum]) {
            teamData[teamName].songDetails[r.songNum] = { p: 0, g: 0, gd: 0, b: 0, m: 0, score: 0, flg: r.flg };
          }

          teamData[teamName].songs[r.songNum] = (teamData[teamName].songs[r.songNum] || 0) + r.score;
          teamData[teamName].flgs[r.songNum] = r.flg;
          teamData[teamName].total += r.score;

          teamData[teamName].p += (parseInt(r.p, 10) || 0);
          teamData[teamName].g += (parseInt(r.g, 10) || 0);
          teamData[teamName].gd += (parseInt(r.gd, 10) || 0);
          teamData[teamName].b += (parseInt(r.b, 10) || 0);
          teamData[teamName].m += (parseInt(r.m, 10) || 0);

          const curS = teamData[teamName].songDetails[r.songNum];
          curS.p += (parseInt(r.p, 10) || 0);
          curS.g += (parseInt(r.g, 10) || 0);
          curS.gd += (parseInt(r.gd, 10) || 0);
          curS.b += (parseInt(r.b, 10) || 0);
          curS.m += (parseInt(r.m, 10) || 0);
          curS.score += r.score;

          if (isDoubles && pName) {
            teamData[teamName].members[pName] = teamData[teamName].members[pName] || {};
            teamData[teamName].members[pName][r.songNum] = { p: r.p, g: r.g, gd: r.gd, b: r.b, m: r.m, score: r.score, flg: r.flg };
          }
        }
      });

      const songNums = ["1", "2", "3"];
      let tabsHTML = songNums.map(num => `<button class="tab-btn ${currentSongTab === num ? 'active' : ''}" onclick="selectSongTab('${num}')">${num}曲目</button>`).join('') +
        `<button class="tab-btn ${currentSongTab === 'final' ? 'active' : ''}" onclick="selectSongTab('final')">最終結果</button>`;

      let tableHTML = "";
      let titleBannerHTML = "";

      if (currentSongTab === 'final') {
        titleBannerHTML = `<div class="song-title-banner">最終結果</div>`;

        let allTotals = teamOrder.map(n => (isDoubles && csvFinalRows[n]) ? csvFinalRows[n].score : teamData[n].total);
        const maxScore = Math.max(...allTotals);
        const rankMap = calculateRanks(allTotals);

        // 最終結果：2チーム（2列：青・橙）
        let headerRow = `<tr><th class="row-header"></th>` +
          teamOrder.map((name, idx) => {
            const colorClass = isDoubles ? ((idx === 0) ? 'team-blue' : 'team-orange') : '';
            return `<th class="player-header ${colorClass}">${name}</th>`;
          }).join('') + `</tr>`;

        let songRows = songNums.map((num, idx) => {
          const sName = songMap[num] ? `<br><small style="font-weight:normal; color:#555;">（${songMap[num]}）</small>` : '';
          let row = `<tr><td class="row-header">${num}曲目${sName}</td>`;
          teamOrder.forEach(n => {
            const sScore = teamData[n].songs[num] !== undefined ? teamData[n].songs[num] : 0;
            const sFlg = teamData[n].flgs[num] || "";
            const cellContent = teamData[n].songs[num] !== undefined ? renderScoreCell(sScore, sFlg, false, true) : '-';
            row += `<td class="sub-score"><span class="anim-target" data-anim-step="${idx + 1}">${cellContent}</span></td>`;
          });
          return row + `</tr>`;
        }).join('');

        let summaryRows = "";
        if (isDoubles) {
          const getVal = (n, key) => (csvFinalRows[n] ? csvFinalRows[n][key] : teamData[n][key]).toLocaleString();
          summaryRows += `<tr><td class="row-header p-perfect">PERFECT 合計</td>` + teamOrder.map(n => `<td class="p-perfect"><span class="anim-target" data-anim-step="4">${getVal(n, 'p')}</span></td>`).join('') + `</tr>`;
          summaryRows += `<tr><td class="row-header p-great">GREAT 合計</td>` + teamOrder.map(n => `<td class="p-great"><span class="anim-target" data-anim-step="4">${getVal(n, 'g')}</span></td>`).join('') + `</tr>`;
          summaryRows += `<tr><td class="row-header p-good">GOOD 合計</td>` + teamOrder.map(n => `<td class="p-good"><span class="anim-target" data-anim-step="4">${getVal(n, 'gd')}</span></td>`).join('') + `</tr>`;
          summaryRows += `<tr><td class="row-header p-bad">BAD 合計</td>` + teamOrder.map(n => `<td class="p-bad"><span class="anim-target" data-anim-step="4">${getVal(n, 'b')}</span></td>`).join('') + `</tr>`;
          summaryRows += `<tr><td class="row-header p-miss">MISS 合計</td>` + teamOrder.map(n => `<td class="p-miss"><span class="anim-target" data-anim-step="4">${getVal(n, 'm')}</span></td>`).join('') + `</tr>`;
        }

        let totalRow = `<tr><td class="row-header" style="font-size:1.15rem; color:#006699;">合計得点</td>` + teamOrder.map(n => {
          const finalScore = csvFinalRows[n] ? csvFinalRows[n].score : teamData[n].total;
          const isWinner = finalScore === maxScore && maxScore > 0;
          return `<td class="score"><span class="anim-target" data-anim-step="4">${renderScoreCell(finalScore, "", isWinner, false)}</span></td>`;
        }).join('') + `</tr>`;

        let rankRow = `<tr><td class="row-header" style="font-size:1.15rem; color:#111;">順位</td>` + teamOrder.map(n => {
          const finalScore = csvFinalRows[n] ? csvFinalRows[n].score : teamData[n].total;
          const rank = rankMap.get(finalScore);
          return `<td class="${rank <= 3 ? 'rank-' + rank : ''}"><span class="anim-target" data-anim-step="4">${rank}位</span></td>`;
        }).join('') + `</tr>`;

        tableHTML = `<thead>${headerRow}</thead><tbody>${songRows}${summaryRows}${totalRow}${rankRow}</tbody>`;

      } else {
        const songNameStr = songMap[currentSongTab] ? songMap[currentSongTab] : `${currentSongTab}曲目`;
        titleBannerHTML = `<div class="song-title-banner">${currentSongTab}曲目：${songNameStr}</div>`;

        let columns = [];

        if (isDoubles && currentSongTab === "3") {
          // 3曲目のみ各チーム2名（計4列：青・青・橙・橙）
          teamOrder.forEach((tName, teamIdx) => {
            const members = Object.keys(teamData[tName].members);
            if (members.length > 0) {
              members.forEach(mName => {
                columns.push({
                  header: `${tName}<br><small style="font-size:0.95rem; font-weight:normal;">(${mName})</small>`,
                  teamIdx: teamIdx,
                  data: teamData[tName].members[mName]?.[currentSongTab]
                });
              });
            } else {
              columns.push({ header: tName, teamIdx: teamIdx, data: null });
            }
          });
        } else if (isDoubles) {
          // 1,2曲目はチーム代表の各1名（計2列：青・橙）
          teamOrder.forEach((tName, teamIdx) => {
            const members = Object.keys(teamData[tName].members);
            let pNameFound = "";
            members.forEach(mName => {
              if (teamData[tName].members[mName]?.[currentSongTab]) {
                pNameFound = mName;
              }
            });

            const songDet = teamData[tName].songDetails[currentSongTab];
            const headerLabel = pNameFound 
              ? `${tName}<br><small style="font-size:0.95rem; font-weight:normal;">(${pNameFound})</small>`
              : tName;

            columns.push({
              header: headerLabel,
              teamIdx: teamIdx,
              data: songDet || null
            });
          });
        } else {
          // シングルス部門
          const targetSongRows = matchRows.filter(r => String(r.songNum) === String(currentSongTab));
          teamOrder.forEach((tName, teamIdx) => {
            const rowData = targetSongRows.find(r => r.name.includes(tName));
            columns.push({ header: tName, teamIdx: teamIdx, data: rowData });
          });
        }

        const validScores = columns.map(c => c.data ? c.data.score : -1);
        const maxScore = validScores.length > 0 ? Math.max(...validScores) : -1;

        // ヘッダーの色分け設定
        let headerRow = `<tr><th class="row-header"></th>` +
          columns.map((col, idx) => {
            let colorClass = '';
            if (isDoubles) {
              if (currentSongTab === "3") {
                colorClass = (idx < 2) ? 'team-blue' : 'team-orange';
              } else {
                colorClass = (idx === 0) ? 'team-blue' : 'team-orange';
              }
            }
            return `<th class="player-header ${colorClass}">${col.header}</th>`;
          }).join('') + `</tr>`;

        const getValStr = (col, key) => col.data ? parseInt(col.data[key] || 0, 10).toLocaleString() : '-';

        let pRow = `<tr><td class="row-header p-perfect">PERFECT</td>` + columns.map(c => `<td class="p-perfect"><span class="anim-target" data-anim-step="1">${getValStr(c, 'p')}</span></td>`).join('') + `</tr>`;
        let gRow = `<tr><td class="row-header p-great">GREAT</td>` + columns.map(c => `<td class="p-great"><span class="anim-target" data-anim-step="1">${getValStr(c, 'g')}</span></td>`).join('') + `</tr>`;
        let gdRow = `<tr><td class="row-header p-good">GOOD</td>` + columns.map(c => `<td class="p-good"><span class="anim-target" data-anim-step="1">${getValStr(c, 'gd')}</span></td>`).join('') + `</tr>`;
        let bRow = `<tr><td class="row-header p-bad">BAD</td>` + columns.map(c => `<td class="p-bad"><span class="anim-target" data-anim-step="1">${getValStr(c, 'b')}</span></td>`).join('') + `</tr>`;
        let mRow = `<tr><td class="row-header p-miss">MISS</td>` + columns.map(c => `<td class="p-miss"><span class="anim-target" data-anim-step="1">${getValStr(c, 'm')}</span></td>`).join('') + `</tr>`;

        let scoreRow = `<tr><td class="row-header" style="font-size:1.15rem; color:#006699;">得点</td>` + columns.map(c => {
          if (!c.data) return `<td class="score">-</td>`;
          const isTop = c.data.score === maxScore && maxScore > 0;
          return `<td class="score"><span class="anim-target" data-anim-step="2">${renderScoreCell(c.data.score, c.data.flg, isTop, true)}</span></td>`;
        }).join('') + `</tr>`;

        tableHTML = `<thead>${headerRow}</thead><tbody>${pRow}${gRow}${gdRow}${bRow}${mRow}${scoreRow}</tbody>`;
      }

      view.innerHTML = `
        <h1>${currentDept}部門 - ${currentRound} ${matchLabel}</h1>
        <div class="tab-container">${tabsHTML}</div>
        ${titleBannerHTML}
        <div class="table-container" id="table-box"><table>${tableHTML}</table></div>
        <button class="btn-back" onclick="navTo('song')">← 結果選択に戻る</button>
      `;
    }
  </script>
</body>
</html>
