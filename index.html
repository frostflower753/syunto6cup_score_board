<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>大会リザルトシステム</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #f4f6f9;
      color: #333333;
      margin: 0; padding: 20px;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh;
    }

    /* CSV読み込みステータス */
    .status-bar {
      position: fixed; top: 10px; right: 10px;
      padding: 6px 12px; border-radius: 20px;
      font-size: 0.8rem; font-weight: bold;
      display: flex; align-items: center; gap: 6px;
      background: rgba(255, 255, 255, 0.9); border: 1px solid #ccc;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      z-index: 1000;
    }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #888; }
    .status-dot.ok { background: #00cc44; box-shadow: 0 0 6px #00cc44; }
    .status-dot.ng { background: #ff3333; box-shadow: 0 0 6px #ff3333; }

    /* 全体コンテナ */
    .container {
      width: 100%; max-width: 1000px;
      margin-top: 30px; text-align: center;
    }

    /* パンくずリスト */
    .breadcrumb {
      display: flex; justify-content: center; align-items: center; gap: 8px;
      margin-bottom: 20px; font-size: 0.95rem; color: #666666; flex-wrap: wrap;
    }
    .breadcrumb-item { cursor: pointer; text-decoration: underline; color: #0066cc; }
    .breadcrumb-item:hover { color: #003399; }
    .breadcrumb-current { color: #111111; font-weight: bold; }

    /* タイトルエリア */
    h1 { color: #111111; margin-bottom: 10px; }
    p.subtitle { color: #666666; margin-top: 0; margin-bottom: 25px; }

    /* ボタン・カード一覧 */
    .card-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px; margin-top: 20px;
    }
    .selection-card {
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 12px; padding: 25px 15px;
      font-size: 1.2rem; font-weight: bold; color: #111111;
      cursor: pointer; transition: all 0.2s ease;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .selection-card:hover {
      background: #f0f7ff;
      border-color: #0066cc;
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0, 102, 204, 0.15);
    }
    .selection-card.gold-card {
      border-color: #e6b800;
      background: #fffdf0;
    }
    .selection-card.gold-card:hover {
      background: #fff9d6;
      border-color: #d4a000;
      box-shadow: 0 5px 15px rgba(212, 160, 0, 0.2);
    }
    .selection-card .sub { font-size: 0.85rem; color: #666666; font-weight: normal; margin-top: 5px; }

    /* タブ切り替え */
    .tab-container {
      display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap;
    }
    .tab-btn {
      background: #ffffff; border: 1px solid #cccccc;
      color: #333333; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
      transition: all 0.2s;
    }
    .tab-btn:hover { background: #e8f2ff; }
    .tab-btn.active {
      background: #0066cc; color: #ffffff; font-weight: bold; border-color: #0066cc;
      box-shadow: 0 2px 8px rgba(0, 102, 204, 0.3);
    }

    /* 操作ガイド */
    .anim-hint {
      font-size: 0.9rem; color: #0066cc; margin-bottom: 15px; font-weight: bold;
    }

    /* リザルトテーブル */
    .table-container {
      background: #ffffff;
      border-radius: 12px; border: 1px solid #e1e4e8;
      overflow-x: auto; margin-top: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    table { width: 100%; border-collapse: collapse; text-align: center; white-space: nowrap; }
    th, td { padding: 14px 16px; font-size: 0.95rem; border-bottom: 1px solid #e1e4e8; border-right: 1px solid #f0f0f0; }
    th:last-child, td:last-child { border-right: none; }
    
    /* 1列目（見出し列）のスタイル */
    .row-header {
      background: #f8fafc;
      font-weight: bold;
      color: #004499;
      text-align: right;
      width: 140px;
    }
    .player-header {
      background: #e8f2ff;
      color: #004499;
      font-size: 1.1rem;
      font-weight: bold;
    }

    /* スコア関連色分け */
    .p-perfect { color: #d4a000; font-weight: bold; }
    .p-great { color: #008800; font-weight: bold; }
    .p-good { color: #0088cc; }
    .p-bad { color: #cc00cc; }
    .p-miss { color: #cc0000; }
    .score { font-family: monospace; font-size: 1.25rem; color: #006699; font-weight: bold; }
    .sub-score { font-family: monospace; font-size: 1.05rem; color: #333333; }
    .rank-1 { color: #d4a000; font-size: 1.3rem; font-weight: bold; }
    .rank-2 { color: #777777; font-size: 1.2rem; font-weight: bold; }
    .rank-3 { color: #b85c00; font-size: 1.1rem; font-weight: bold; }

    /* スコアセルのレイアウト構成 */
    .score-box {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 8px;
    }

    /* AP/FC 左上に斜め配置 */
    .badge-ap, .badge-fc {
      position: absolute;
      top: -4px;
      left: -15px;
      font-size: 0.7rem;
      font-weight: 900;
      transform: rotate(-15deg);
      white-space: nowrap;
      pointer-events: none;
    }

    .badge-ap {
      background: linear-gradient(90deg, #ff0000, #ff7f00, #e6b800, #00aa00, #0088cc, #8b00ff);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: rainbow 2s linear infinite;
    }

    .badge-fc {
      color: #e60073;
      text-shadow: 0 0 2px #ffb3d9;
    }

    @keyframes rainbow {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    /* 戻るボタン */
    .btn-back {
      margin-top: 25px; background: #ffffff; border: 1px solid #cccccc;
      color: #555555; padding: 8px 20px; border-radius: 6px; cursor: pointer;
      transition: all 0.2s;
    }
    .btn-back:hover { background: #f0f0f0; color: #111; }

    /* アニメーション定義（Enterキー入力待機用） */
    @keyframes dropIn {
      0% { opacity: 0; transform: translateY(-8px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .anim-item { opacity: 0; }
    .anim-active .anim-base { animation: dropIn 0.3s ease forwards 0.0s; }
    .anim-active .anim-p { animation: dropIn 0.4s ease forwards 0.2s; }
    .anim-active .anim-g { animation: dropIn 0.4s ease forwards 0.5s; }
    .anim-active .anim-gd { animation: dropIn 0.4s ease forwards 0.8s; }
    .anim-active .anim-b { animation: dropIn 0.4s ease forwards 1.1s; }
    .anim-active .anim-m { animation: dropIn 0.4s ease forwards 1.4s; }
    .anim-active .anim-song { animation: dropIn 0.4s ease forwards 1.7s; }
    .anim-active .anim-score { animation: dropIn 0.5s ease forwards 2.0s; }
    .anim-active .anim-rank { animation: dropIn 0.5s ease forwards 2.3s; }
  </style>
</head>
<body>

  <div class="status-bar">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">CSV読み込み確認中...</span>
  </div>

  <div class="container">
    <div class="breadcrumb" id="breadcrumb"></div>
    <div id="view-area"></div>
  </div>

  <script>
    const ROUND_NAMES = {
      "QF": "準々決勝",
      "SF": "準決勝",
      "Final": "決勝",
      "準々決勝": "準々決勝",
      "準決勝": "準決勝",
      "決勝": "決勝"
    };

    const DEFAULT_STRUCTURE = {
      "STANDARD": { "準々決勝": [1], "準決勝": [1], "決勝": [1] },
      "NEXT": { "準々決勝": [1, 2, 3, 4], "準決勝": [1, 2], "決勝": [1] },
      "ULTIMATE": { "準々決勝": [1, 2], "準決勝": [1, 2], "決勝": [1] },
      "DOUBLES": { "準々決勝": [1, 2, 3, 4], "準決勝": [1, 2], "決勝": [1] }
    };

    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSJ9mquQm_J8GBgOq2Qj_aHNJGLbCZTgIU4uK_GH0bjRSYwHbQ6xKLyATkmaTeNX3_6pqzy7XmHmowm/pub?gid=1560276695&single=true&output=csv"; 

    let treeData = {};
    let currentDept = null;
    let currentRound = null;
    let currentMatch = null;
    let currentSongTab = null;

    fetchCSV();

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        triggerAnimation();
      }
    });

    function triggerAnimation() {
      const container = document.getElementById('table-box');
      if (!container) return;
      container.classList.add('anim-active');
    }

    async function fetchCSV() {
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');

      try {
        const res = await fetch(`${CSV_URL}&t=${new Date().getTime()}`);
        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
        
        const csvText = await res.text();
        parseCSV(csvText);

        dot.className = "status-dot ok";
        text.innerText = "CSV読み込み完了";
      } catch (err) {
        dot.className = "status-dot ng";
        text.innerText = "CSV読み込み失敗";
      }
      render();
    }

    function parseCSV(text) {
      const rows = text.trim().split(/\r?\n/).map(r => r.split(',').map(c => c ? c.replace(/"/g, '').trim() : ''));
      if (rows.length < 2) return;

      const header = rows[0];

      const idxDept = header.findIndex(h => h.includes('部門'));
      const idxRound = header.findIndex(h => h.includes('ラウンド'));
      const idxMatch = header.findIndex(h => h.includes('試合'));
      const idxSongNum = header.findIndex(h => h.includes('曲番号') || h.includes('曲目'));
      const idxSongName = header.findIndex(h => h.includes('曲名'));
      const idxName = header.findIndex(h => h.includes('プレイヤー') || h.includes('名前') || h.includes('チーム'));
      const idxP = header.findIndex(h => h.toUpperCase().includes('PERFECT'));
      const idxG = header.findIndex(h => h.toUpperCase().includes('GREAT'));
      const idxGd = header.findIndex(h => h.toUpperCase().includes('GOOD'));
      const idxB = header.findIndex(h => h.toUpperCase().includes('BAD'));
      const idxM = header.findIndex(h => h.toUpperCase().includes('MISS'));
      const idxScore = header.findIndex(h => h.includes('得点') || h.includes('スコア'));
      
      let idxFlg = header.findIndex(h => h.toUpperCase().includes('AP') || h.toUpperCase().includes('FC') || h.includes('FLG') || h.includes('フラグ'));
      if (idxFlg === -1) idxFlg = 11;

      treeData = {};

      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        
        const dept = idxDept !== -1 && row[idxDept] ? row[idxDept] : "共通";
        const rawRound = idxRound !== -1 ? row[idxRound] : "";
        const match = idxMatch !== -1 ? row[idxMatch] : "";
        const songNum = idxSongNum !== -1 ? row[idxSongNum] : "";
        const songName = idxSongName !== -1 ? row[idxSongName] : "";
        const name = idxName !== -1 ? row[idxName] : "";

        if (!rawRound || !match || !name) continue;

        const round = ROUND_NAMES[rawRound] || rawRound;
        const p = idxP !== -1 ? row[idxP] : "0";
        const g = idxG !== -1 ? row[idxG] : "0";
        const gd = idxGd !== -1 ? row[idxGd] : "0";
        const b = idxB !== -1 ? row[idxB] : "0";
        const m = idxM !== -1 ? row[idxM] : "0";
        const scoreStr = idxScore !== -1 ? row[idxScore] : "0";
        const score = parseInt(scoreStr, 10) || 0;
        const flg = row[idxFlg] ? row[idxFlg].toUpperCase().trim() : "";

        const targetDepts = (dept === "共通") ? ["STANDARD", "NEXT", "ULTIMATE", "DOUBLES"] : [dept];

        targetDepts.forEach(d => {
          if (!treeData[d]) treeData[d] = {};
          if (!treeData[d][round]) treeData[d][round] = {};
          if (!treeData[d][round][match]) treeData[d][round][match] = [];

          treeData[d][round][match].push({ songNum, songName, name, p, g, gd, b, m, score, flg });
        });
      }
    }

    function getMatchDisplayName(dept, round, matchNum) {
      if (dept === 'ULTIMATE' && round === '準々決勝') {
        if (String(matchNum) === '1') return 'GroupA';
        if (String(matchNum) === '2') return 'GroupB';
      }
      return `第${matchNum}試合`;
    }

    function renderScoreCell(score, flg) {
      const formattedScore = score.toLocaleString();
      let badgeHTML = '';

      if (flg === "AP" || flg === "ALL PERFECT") {
        badgeHTML = `<span class="badge-ap">ALL PERFECT</span>`;
      } else if (flg === "FC" || flg === "FULL COMBO") {
        badgeHTML = `<span class="badge-fc">FULL COMBO</span>`;
      }

      return `<div class="score-box">${badgeHTML}<span>${formattedScore}</span></div>`;
    }

    function renderBreadcrumb() {
      const nav = document.getElementById('breadcrumb');
      let html = `<span class="breadcrumb-item" onclick="navTo('dept')">TOP (部門選択)</span>`;

      if (currentDept) {
        html += ` ＞ `;
        if (currentRound) {
          html += `<span class="breadcrumb-item" onclick="navTo('round')">${currentDept}</span>`;
        } else {
          html += `<span class="breadcrumb-current">${currentDept}</span>`;
        }
      }

      if (currentRound) {
        html += ` ＞ `;
        if (currentMatch) {
          html += `<span class="breadcrumb-item" onclick="navTo('match')">${currentRound}</span>`;
        } else {
          html += `<span class="breadcrumb-current">${currentRound}</span>`;
        }
      }

      if (currentMatch) {
        const matchLabel = getMatchDisplayName(currentDept, currentRound, currentMatch);
        html += ` ＞ `;
        if (currentSongTab !== null) {
          html += `<span class="breadcrumb-item" onclick="navTo('song')">${matchLabel}</span>`;
        } else {
          html += `<span class="breadcrumb-current">${matchLabel}</span>`;
        }
      }

      if (currentSongTab !== null) {
        const tabLabel = currentSongTab === 'final' ? '🏆 最終結果' : `${currentSongTab}曲目`;
        html += ` ＞ <span class="breadcrumb-current">${tabLabel}</span>`;
      }

      nav.innerHTML = html;
    }

    function navTo(level) {
      if (level === 'dept') { currentDept = null; currentRound = null; currentMatch = null; currentSongTab = null; }
      else if (level === 'round') { currentRound = null; currentMatch = null; currentSongTab = null; }
      else if (level === 'match') { currentMatch = null; currentSongTab = null; }
      else if (level === 'song') { currentSongTab = null; }
      render();
    }

    function render() {
      renderBreadcrumb();
      const view = document.getElementById('view-area');

      // 1. 部門選択
      if (!currentDept) {
        const depts = Array.from(new Set([
          ...Object.keys(DEFAULT_STRUCTURE),
          ...Object.keys(treeData)
        ]));

        let cardsHTML = depts.map(d => `
          <div class="selection-card" onclick="selectDept('${d}')">
            ${d} 部門
            <div class="sub">クリックして決定</div>
          </div>
        `).join('');

        view.innerHTML = `
          <h1>部門を選択してください</h1>
          <p class="subtitle">表示したい部門を選択して次へ進みます</p>
          <div class="card-grid">${cardsHTML}</div>
        `;
        return;
      }

      // 2. ラウンド選択
      if (!currentRound) {
        const defaultRounds = DEFAULT_STRUCTURE[currentDept] ? Object.keys(DEFAULT_STRUCTURE[currentDept]) : [];
        const csvRounds = treeData[currentDept] ? Object.keys(treeData[currentDept]) : [];
        const rounds = Array.from(new Set([...defaultRounds, ...csvRounds]));

        let cardsHTML = rounds.map(r => `
          <div class="selection-card" onclick="selectRound('${r}')">
            ${r}
            <div class="sub">クリックして決定</div>
          </div>
        `).join('');

        view.innerHTML = `
          <h1>ラウンドを選択してください</h1>
          <p class="subtitle">【${currentDept}部門】のラウンドを選択してください</p>
          <div class="card-grid">${cardsHTML}</div>
          <button class="btn-back" onclick="navTo('dept')">← 部門選択に戻る</button>
        `;
        return;
      }

      // 3. 試合選択
      if (!currentMatch) {
        const defaultMatches = DEFAULT_STRUCTURE[currentDept]?.[currentRound] 
          ? DEFAULT_STRUCTURE[currentDept][currentRound].map(String) : [];
        const csvMatches = treeData[currentDept]?.[currentRound] 
          ? Object.keys(treeData[currentDept][currentRound]) : [];
        const matches = Array.from(new Set([...defaultMatches, ...csvMatches]))
          .sort((a,b) => parseInt(a) - parseInt(b));

        let cardsHTML = matches.map(m => {
          const displayLabel = getMatchDisplayName(currentDept, currentRound, m);
          return `
            <div class="selection-card" onclick="selectMatch('${m}')">
              ${displayLabel}
              <div class="sub">結果表示へ進む</div>
            </div>
          `;
        }).join('');

        view.innerHTML = `
          <h1>試合を選択してください</h1>
          <p class="subtitle">【${currentDept}部門 / ${currentRound}】の対戦カードを選択してください</p>
          <div class="card-grid">${cardsHTML}</div>
          <button class="btn-back" onclick="navTo('round')">← ラウンド選択に戻る</button>
        `;
        return;
      }

      // 4. 曲目・最終結果 選択
      if (currentSongTab === null) {
        const matchRows = treeData[currentDept]?.[currentRound]?.[currentMatch] || [];
        const matchLabel = getMatchDisplayName(currentDept, currentRound, currentMatch);

        if (matchRows.length === 0) {
          view.innerHTML = `
            <h1>${currentDept}部門 - ${currentRound} ${matchLabel}</h1>
            <div style="padding: 50px 20px; background: #ffffff; border-radius: 12px; border: 1px dashed #cccccc; margin-top: 20px;">
              <p style="font-size: 1.3rem; color: #666666; margin-bottom: 10px; font-weight: bold;">📭 データがありません</p>
              <p style="font-size: 0.95rem; color: #888888; margin: 0;">この試合のリザルトデータはまだスプレッドシートに登録されていません。</p>
            </div>
            <button class="btn-back" onclick="navTo('match')">← 試合選択に戻る</button>
          `;
          return;
        }

        let songNums = Array.from(new Set(matchRows.map(r => r.songNum).filter(Boolean))).sort((a,b) => a - b);
        if (songNums.length === 0) songNums = ["1", "2", "3"];

        let songCardsHTML = songNums.map(num => `
          <div class="selection-card" onclick="selectSongTab('${num}')">
            ${num}曲目
            <div class="sub">${num}曲目のスコア結果</div>
          </div>
        `).join('');

        songCardsHTML += `
          <div class="selection-card gold-card" onclick="selectSongTab('final')">
            🏆 最終結果
            <div class="sub">総合スコア・最終順位</div>
          </div>
        `;

        view.innerHTML = `
          <h1>表示する結果を選択してください</h1>
          <p class="subtitle">【${currentDept}部門 / ${currentRound} ${matchLabel}】</p>
          <div class="card-grid">${songCardsHTML}</div>
          <button class="btn-back" onclick="navTo('match')">← 試合選択に戻る</button>
        `;
        return;
      }

      // 5. リザルト表示
      renderResultView(view);
    }

    function selectDept(d) { currentDept = d; render(); }
    function selectRound(r) { currentRound = r; render(); }
    function selectMatch(m) { currentMatch = m; currentSongTab = null; render(); }
    function selectSongTab(tab) { currentSongTab = tab; render(); }

    function renderResultView(view) {
      const matchRows = treeData[currentDept]?.[currentRound]?.[currentMatch] || [];
      const matchLabel = getMatchDisplayName(currentDept, currentRound, currentMatch);

      const isDoubles = currentDept.toUpperCase().includes("DOUBLES");
      const songMap = {};
      
      const teamOrder = [];
      const teamScores = {};

      matchRows.forEach(r => {
        if (r.songNum) {
          if (r.songName) songMap[r.songNum] = r.songName;

          let entityName = r.name;
          if (isDoubles && r.name.includes("(")) {
            entityName = r.name.split("(")[0].trim();
          }

          if (!teamScores[entityName]) {
            teamOrder.push(entityName);
            teamScores[entityName] = { total: 0, songs: {}, flgs: {}, p: 0, g: 0, gd: 0, b: 0, m: 0 };
          }
          
          teamScores[entityName].songs[r.songNum] = (teamScores[entityName].songs[r.songNum] || 0) + r.score;
          teamScores[entityName].flgs[r.songNum] = r.flg;
          teamScores[entityName].total += r.score;

          teamScores[entityName].p += (parseInt(r.p, 10) || 0);
          teamScores[entityName].g += (parseInt(r.g, 10) || 0);
          teamScores[entityName].gd += (parseInt(r.gd, 10) || 0);
          teamScores[entityName].b += (parseInt(r.b, 10) || 0);
          teamScores[entityName].m += (parseInt(r.m, 10) || 0);
        }
      });

      let csvSongNums = Object.keys(songMap);
      if (csvSongNums.length === 0) csvSongNums = ["1", "2", "3"];
      const songNums = Array.from(new Set([...csvSongNums])).sort((a,b) => a - b);

      let tabsHTML = songNums.map(num => `
        <button class="tab-btn ${currentSongTab === num ? 'active' : ''}" onclick="selectSongTab('${num}')">
          ${num}曲目
        </button>
      `).join('');

      tabsHTML += `
        <button class="tab-btn ${currentSongTab === 'final' ? 'active' : ''}" onclick="selectSongTab('final')">
          🏆 最終結果
        </button>
      `;

      let tableHTML = "";

      if (currentSongTab === 'final') {
        // 🏆 最終結果画面 (転置レイアウト)
        const sortedList = [...teamOrder].sort((a, b) => teamScores[b].total - teamScores[a].total);
        const rankMap = {};
        sortedList.forEach((name, idx) => { rankMap[name] = idx + 1; });

        // ヘッダー行: 1列目は項目名、2列目以降にプレイヤー名
        let headerRow = `<tr><th class="row-header">${isDoubles ? 'チーム' : '項目 / プレイヤー'}</th>`;
        teamOrder.forEach(name => {
          headerRow += `<th class="player-header anim-item anim-base">${name}</th>`;
        });
        headerRow += `</tr>`;

        // 判定行
        let pRow = `<tr><td class="row-header p-perfect">PERFECT</td>` + teamOrder.map(n => `<td class="p-perfect anim-item anim-p">${teamScores[n].p.toLocaleString()}</td>`).join('') + `</tr>`;
        let gRow = `<tr><td class="row-header p-great">GREAT</td>` + teamOrder.map(n => `<td class="p-great anim-item anim-g">${teamScores[n].g.toLocaleString()}</td>`).join('') + `</tr>`;
        let gdRow = `<tr><td class="row-header p-good">GOOD</td>` + teamOrder.map(n => `<td class="p-good anim-item anim-gd">${teamScores[n].gd.toLocaleString()}</td>`).join('') + `</tr>`;
        let bRow = `<tr><td class="row-header p-bad">BAD</td>` + teamOrder.map(n => `<td class="p-bad anim-item anim-b">${teamScores[n].b.toLocaleString()}</td>`).join('') + `</tr>`;
        let mRow = `<tr><td class="row-header p-miss">MISS</td>` + teamOrder.map(n => `<td class="p-miss anim-item anim-m">${teamScores[n].m.toLocaleString()}</td>`).join('') + `</tr>`;

        // 各曲の得点行
        let songRows = songNums.map(num => {
          const sName = songMap[num] ? `<br><small>${songMap[num]}</small>` : '';
          let row = `<tr><td class="row-header">${num}曲目${sName}</td>`;
          teamOrder.forEach(n => {
            const sScore = teamScores[n].songs[num] !== undefined ? teamScores[n].songs[num] : 0;
            const sFlg = teamScores[n].flgs[num] || "";
            const cellContent = teamScores[n].songs[num] !== undefined ? renderScoreCell(sScore, sFlg) : '-';
            row += `<td class="sub-score anim-item anim-song">${cellContent}</td>`;
          });
          row += `</tr>`;
          return row;
        }).join('');

        // 合計得点行
        let totalRow = `<tr><td class="row-header" style="font-size:1.1rem; color:#006699;">合計得点</td>` + teamOrder.map(n => `<td class="score anim-item anim-score">${renderScoreCell(teamScores[n].total, "")}</td>`).join('') + `</tr>`;

        // 順位行
        let rankRow = `<tr><td class="row-header" style="font-size:1.1rem; color:#111;">順位</td>` + teamOrder.map(n => {
          const rank = rankMap[n];
          return `<td class="${rank <= 3 ? 'rank-' + rank : ''} anim-item anim-rank">${rank}位</td>`;
        }).join('') + `</tr>`;

        tableHTML = `
          <thead>${headerRow}</thead>
          <tbody>
            ${pRow}${gRow}${gdRow}${bRow}${mRow}
            ${songRows}
            ${totalRow}
            ${rankRow}
          </tbody>
        `;

      } else {
        // 🎵 個別曲目（1〜3曲目）画面 (転置レイアウト)
        const targetSongRows = matchRows.filter(r => String(r.songNum) === String(currentSongTab));

        const sortedList = [...targetSongRows].sort((a, b) => b.score - a.score);
        const rankMap = new Map();
        sortedList.forEach((r, idx) => { rankMap.set(r, idx + 1); });

        // ヘッダー行
        let headerRow = `<tr><th class="row-header">${isDoubles ? 'チーム' : '項目 / プレイヤー'}</th>`;
        targetSongRows.forEach(p => {
          headerRow += `<th class="player-header anim-item anim-base">${p.name}</th>`;
        });
        headerRow += `</tr>`;

        // 判定・スコア各行
        let pRow = `<tr><td class="row-header p-perfect">PERFECT</td>` + targetSongRows.map(p => `<td class="p-perfect anim-item anim-p">${parseInt(p.p, 10).toLocaleString()}</td>`).join('') + `</tr>`;
        let gRow = `<tr><td class="row-header p-great">GREAT</td>` + targetSongRows.map(p => `<td class="p-great anim-item anim-g">${parseInt(p.g, 10).toLocaleString()}</td>`).join('') + `</tr>`;
        let gdRow = `<tr><td class="row-header p-good">GOOD</td>` + targetSongRows.map(p => `<td class="p-good anim-item anim-gd">${parseInt(p.gd, 10).toLocaleString()}</td>`).join('') + `</tr>`;
        let bRow = `<tr><td class="row-header p-bad">BAD</td>` + targetSongRows.map(p => `<td class="p-bad anim-item anim-b">${parseInt(p.b, 10).toLocaleString()}</td>`).join('') + `</tr>`;
        let mRow = `<tr><td class="row-header p-miss">MISS</td>` + targetSongRows.map(p => `<td class="p-miss anim-item anim-m">${parseInt(p.m, 10).toLocaleString()}</td>`).join('') + `</tr>`;

        let scoreRow = `<tr><td class="row-header" style="font-size:1.1rem; color:#006699;">得点</td>` + targetSongRows.map(p => `<td class="score anim-item anim-score">${renderScoreCell(p.score, p.flg)}</td>`).join('') + `</tr>`;

        let rankRow = `<tr><td class="row-header" style="font-size:1.1rem; color:#111;">順位</td>` + targetSongRows.map(p => {
          const rank = rankMap.get(p);
          return `<td class="${rank <= 3 ? 'rank-' + rank : ''} anim-item anim-rank">${rank}位</td>`;
        }).join('') + `</tr>`;

        tableHTML = `
          <thead>${headerRow}</thead>
          <tbody>
            ${pRow}${gRow}${gdRow}${bRow}${mRow}
            ${scoreRow}
            ${rankRow}
          </tbody>
        `;
      }

      view.innerHTML = `
        <h1>${currentDept}部門 - ${currentRound} ${matchLabel}</h1>
        <div class="tab-container">${tabsHTML}</div>
        <div class="anim-hint">⌨️ <b>Enterキー</b> を押すとスコアが表示されます</div>
        <div class="table-container" id="table-box">
          <table>${tableHTML}</table>
        </div>
        <button class="btn-back" onclick="navTo('song')">← 結果選択に戻る</button>
      `;
    }
  </script>
</body>
</html>
