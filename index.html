<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>大会リザルトシステム</title>
  <style>
    /* =========================================
       基本設定・レイアウト
    ========================================= */
    * { box-sizing: border-box; }
    html, body {
      width: 100vw; height: 100vh; margin: 0; padding: 0;
      overflow: hidden;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #f4f6f9; color: #333333;
    }
    .container {
      width: 100%; height: 100%; max-width: 1920px; margin: 0 auto;
      padding: 40px 50px; display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
    }

    /* =========================================
       パンくずリスト・見出し
    ========================================= */
    .breadcrumb {
      display: flex; justify-content: center; align-items: center; gap: 12px;
      margin-bottom: 20px; font-size: 1.2rem; color: #666666; flex-wrap: wrap;
    }
    .breadcrumb-item { cursor: pointer; text-decoration: underline; color: #0066cc; }
    .breadcrumb-item:hover { color: #003399; }
    .breadcrumb-current { color: #111111; font-weight: bold; }

    h1 { color: #111111; font-size: 2.5rem; margin: 5px 0 10px 0; text-align: center; }
    p.subtitle { color: #666666; font-size: 1.2rem; margin: 0 0 35px 0; text-align: center; }
    .song-title-banner { font-size: 2rem; font-weight: bold; color: #111111; margin-bottom: 20px; text-align: center; }

    /* =========================================
       選択ボタン（カード・タブ）
    ========================================= */
    .card-grid {
      display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
      gap: 30px; width: 100%; max-width: 1400px;
    }
    .selection-card {
      width: 280px; height: 220px; background: #ffffff;
      border: 1px solid #d0d7de; border-radius: 14px;
      font-size: 1.5rem; font-weight: bold; color: #111111;
      cursor: pointer; transition: all 0.2s ease;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 6px 14px rgba(0,0,0,0.05);
    }
    .selection-card:hover {
      background: #f0f7ff; border-color: #0066cc; transform: translateY(-4px);
      box-shadow: 0 10px 24px rgba(0, 102, 204, 0.18);
    }
    .selection-card.gold-card { border-color: #e6b800; background: #fffdf0; }
    .selection-card.gold-card:hover { background: #fff9d6; border-color: #d4a000; box-shadow: 0 10px 24px rgba(212, 160, 0, 0.22); }
    .selection-card .sub { font-size: 1rem; color: #666666; font-weight: normal; margin-top: 12px; }

    .tab-container { display: flex; justify-content: center; gap: 14px; margin-bottom: 20px; }
    .tab-btn {
      background: #ffffff; border: 1px solid #cccccc; color: #333333;
      padding: 14px 28px; border-radius: 10px; cursor: pointer; font-size: 1.2rem; transition: all 0.2s;
    }
    .tab-btn:hover { background: #e8f2ff; }
    .tab-btn.active { background: #0066cc; color: #ffffff; font-weight: bold; border-color: #0066cc; box-shadow: 0 4px 12px rgba(0, 102, 204, 0.35); }
    .btn-back { margin-top: 25px; background: #ffffff; border: 1px solid #cccccc; color: #555555; padding: 14px 32px; font-size: 1.1rem; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
    .btn-back:hover { background: #f0f0f0; color: #111; }

    /* =========================================
       テーブル（表）のデザイン
    ========================================= */
    .table-container {
      background: #ffffff; border-radius: 16px; border: 1px solid #e1e4e8;
      overflow-x: auto; width: 100%; max-width: 1750px; box-shadow: 0 8px 24px rgba(0,0,0,0.07);
    }
    table { width: 100%; border-collapse: collapse; text-align: center; white-space: nowrap; }
    th, td { padding: 18px 10px; font-size: 1.25rem; border-bottom: 1px solid #e1e4e8; border-right: 1px solid #f0f0f0; }
    th:last-child, td:last-child { border-right: none; }
    
    .row-header { background: #f8fafc; font-weight: bold; color: #004499; text-align: center; width: 220px; min-width: 220px; font-size: 1.25rem; }
    .player-header { background: #e8f2ff; color: #004499; font-size: 1.4rem; font-weight: bold; min-width: 160px; }

    .team-blue { background: #f0f7ff !important; color: #0055bb !important; border-bottom: 3px solid #0066cc !important; }
    .team-orange { background: #fff5f0 !important; color: #cc4400 !important; border-bottom: 3px solid #ff6600 !important; }

    /* =========================================
       判定・スコアの文字色・装飾
    ========================================= */
    .p-perfect {
      background: linear-gradient(135deg, #00c6ff 0%, #0072ff 30%, #ff007f 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      font-weight: 900; font-size: 1.35rem; display: inline-block;
    }
    .p-great { color: #d0006f; font-weight: bold; font-size: 1.3rem; }
    .p-good { color: #008800; font-weight: bold; font-size: 1.3rem; }
    .p-bad { color: #dd6600; font-weight: bold; font-size: 1.3rem; }
    .p-miss { color: #555555; font-weight: bold; font-size: 1.3rem; }

    .score { font-family: monospace; font-size: 1.65rem; color: #006699; font-weight: bold; }
    .sub-score { font-family: monospace; font-size: 1.35rem; color: #333333; }
    
    .score-highest {
      color: #e60000 !important;
      font-weight: 900 !important;
      transform: scale(1.15);
      display: inline-block;
      text-shadow: 0 0 10px rgba(230, 0, 0, 0.15);
    }
    
    .score-silver { font-size: 2rem !important; color: #a0a0a0 !important; font-weight: 900 !important; text-shadow: 0 0 12px rgba(160, 160, 160, 0.35); transform: scale(1.08); display: inline-block; }

    .rank-badge { font-weight: 900; font-size: 1.3rem; padding: 4px 16px; border-radius: 8px; display: inline-block; }
    .badge-gold { background: #fff9e6; color: #d4a000; border: 1px solid #d4a000; }
    .badge-silver { background: #f2f2f2; color: #a0a0a0; border: 1px solid #a0a0a0; }
    .badge-bronze { background: #fdf3e8; color: #b87333; border: 1px solid #b87333; }
    .badge-red { background: #ffebeb; color: #cc3333; border: 1px solid #cc3333; }
    .badge-black { background: #fafafa; color: #333333; border: 1px solid #cccccc; }

    .score-box { position: relative; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.3s; }
    .badge-ap, .badge-fc { position: absolute; top: -20px; left: -24px; font-size: 0.8rem; font-weight: 900; transform: rotate(-12deg); pointer-events: none; white-space: nowrap; }
    .badge-ap { background: linear-gradient(135deg, #00c6ff 0%, #ff007f 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .badge-fc { color: #d0006f; }

    .diff-expert { color: #ff0000 !important; font-weight: bold; }
    .diff-master { color: #9b51e0 !important; font-weight: bold; }
    .diff-append { background: linear-gradient(135deg, #c896ff 0%, #ff96d5 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-weight: bold; display: inline-block; }

    /* =========================================
       アニメーション要素の制御
    ========================================= */
    .anim-target {
      display: inline-block;
      transition: opacity 0.3s ease-out, transform 0.3s ease-out;
    }
    .anim-hidden {
      opacity: 0;
      visibility: hidden;
      transform: translateY(6px);
    }
    .anim-visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="breadcrumb" id="breadcrumb"></div>
    <div id="view-area" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
  </div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSJ9mquQm_J8GBgOq2Qj_aHNJGLbCZTgIU4uK_GH0bjRSYwHbQ6xKLyATkmaTeNX3_6pqzy7XmHmowm/pub?gid=1560276695&single=true&output=csv"; 
    const ROUND_NAMES = { "QF": "準々決勝", "SF": "準決勝", "Final": "決勝", "FINAL": "決勝" };

    let treeData = {};
    let currentDept = null;
    let currentRound = null;
    let currentMatch = null;
    let currentSongTab = null;
    let animStep = 0;

    function formatSongName(name) {
      if (!name) return "";
      return name
        .replace(/(【?EXPERT\d*】?|\[?EXPERT\d*\]?)/ig, '<span class="diff-expert">$1</span>')
        .replace(/(【?MASTER\d*】?|\[?MASTER\d*\]?)/ig, '<span class="diff-master">$1</span>')
        .replace(/(【?APPEND\d*】?|\[?APPEND\d*\]?)/ig, '<span class="diff-append">$1</span>');
    }

    fetchCSV();
    setInterval(fetchCSV, 5000);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') triggerAnimation();
    });

    function triggerAnimation() {
      animStep++;
      document.querySelectorAll(`[data-anim-step="${animStep}"]`).forEach(el => {
        el.classList.remove('anim-hidden');
        el.classList.add('anim-visible');
      });
    }

    async function fetchCSV() {
      try {
        const res = await fetch(`${CSV_URL}&t=${new Date().getTime()}`);
        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
        const csvText = await res.text();
        parseCSV(csvText);
      } catch (err) {
        console.error("CSV fetch error:", err);
      }
      if (animStep === 0) {
        render(true);
      }
    }

    function parseCSV(text) {
      const rows = text.trim().split(/\r?\n/).map(r => r.split(',').map(c => c ? c.replace(/"/g, '').trim() : ''));
      if (rows.length < 2) return;
      const header = rows[0].map(h => h.toUpperCase());

      const findIdx = (keywords) => header.findIndex(h => keywords.some(k => h.includes(k)));

      const idxDept = findIdx(['部門', 'DEPT']);
      const idxRound = findIdx(['ラウンド', 'ROUND']);
      const idxMatch = findIdx(['試合', 'MATCH']);
      const idxSongNum = findIdx(['曲番号', '曲目', 'SONG']);
      const idxSongName = findIdx(['曲名', 'TITLE']);
      const idxName = findIdx(['プレイヤー', '名前', 'チーム', 'NAME', 'PLAYER']);
      const idxP = findIdx(['PERFECT', 'パーフェクト', 'P']);
      const idxG = findIdx(['GREAT', 'グレート', 'G']);
      const idxGd = findIdx(['GOOD', 'グッド']);
      const idxB = findIdx(['BAD', 'バッド']);
      const idxM = findIdx(['MISS', 'ミス', 'M']);
      const idxScore = findIdx(['合計得点', '得点', 'スコア', 'SCORE']);
      const idxFlg = findIdx(['AP/FC', 'AP', 'FC', 'FLG', 'フラグ', 'CLEAR']);

      treeData = {};

      // スプレッドシートの結合セル対策：直前の値を保持する
      let lastDept = "";
      let lastRound = "";
      let lastMatch = "";

      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row || row.length === 0) continue;

        let dept = (idxDept !== -1 && row[idxDept]) ? row[idxDept].toUpperCase().trim() : "";
        let rawRound = idxRound !== -1 ? row[idxRound] : "";
        let match = idxMatch !== -1 ? String(row[idxMatch]).trim() : "";

        // 結合セルで空欄になっている場合は直前の行のデータを引き継ぐ
        if (dept) lastDept = dept; else dept = lastDept;
        if (rawRound) lastRound = rawRound; else rawRound = lastRound;
        if (match) lastMatch = match; else match = lastMatch;

        if (!match) match = "1";

        const songNum = idxSongNum !== -1 ? String(row[idxSongNum]).trim() : "1";
        const songName = idxSongName !== -1 ? row[idxSongName] : "";
        const name = idxName !== -1 ? row[idxName].trim() : "";

        if (!dept || !name) continue;

        const round = ROUND_NAMES[rawRound] || rawRound || "予選";
        const p = (idxP !== -1 && row[idxP] !== "") ? row[idxP] : "0";
        const g = (idxG !== -1 && row[idxG] !== "") ? row[idxG] : "0";
        const gd = (idxGd !== -1 && row[idxGd] !== "") ? row[idxGd] : "0";
        const b = (idxB !== -1 && row[idxB] !== "") ? row[idxB] : "0";
        const m = (idxM !== -1 && row[idxM] !== "") ? row[idxM] : "0";
        const score = parseInt(idxScore !== -1 ? row[idxScore] : "0", 10) || 0;
        const flg = (idxFlg !== -1 && row[idxFlg]) ? row[idxFlg].toUpperCase().trim() : "";

        if (!treeData[dept]) treeData[dept] = {};
        if (!treeData[dept][round]) treeData[dept][round] = {};
        if (!treeData[dept][round][match]) treeData[dept][round][match] = [];
        
        treeData[dept][round][match].push({ songNum, songName, name, p, g, gd, b, m, score, flg });
      }
    }

    function getMatchDisplayName(dept, round, matchNum) {
      if (dept === 'ULTIMATE' && round === '準々決勝') {
        if (String(matchNum) === '1') return 'GroupA';
        if (String(matchNum) === '2') return 'GroupB';
      }
      return `第${matchNum}試合`;
    }

    function renderScoreCell(score, flg, scoreClass = "", showFlg = true) {
      const formattedScore = (score !== undefined && score !== null) ? Number(score).toLocaleString() : "0";
      let badgeHTML = '';
      if (showFlg) {
        if (flg === "AP" || flg === "ALL PERFECT") badgeHTML = `<span class="badge-ap">ALL PERFECT</span>`;
        else if (flg === "FC" || flg === "FULL COMBO") badgeHTML = `<span class="badge-fc">FULL COMBO</span>`;
      }
      return `<div class="score-box ${scoreClass}">${badgeHTML}<span>${formattedScore}</span></div>`;
    }

    function renderBreadcrumb() {
      const nav = document.getElementById('breadcrumb');
      let html = `<span class="breadcrumb-item" onclick="navTo('dept')">TOP (部門選択)</span>`;
      if (currentDept) html += ` ＞ ` + (currentRound ? `<span class="breadcrumb-item" onclick="navTo('round')">${currentDept}</span>` : `<span class="breadcrumb-current">${currentDept}</span>`);
      if (currentRound) html += ` ＞ ` + (currentMatch ? `<span class="breadcrumb-item" onclick="navTo('match')">${currentRound}</span>` : `<span class="breadcrumb-current">${currentRound}</span>`);
      if (currentMatch) {
        const matchLabel = getMatchDisplayName(currentDept, currentRound, currentMatch);
        html += ` ＞ ` + (currentSongTab !== null ? `<span class="breadcrumb-item" onclick="navTo('song')">${matchLabel}</span>` : `<span class="breadcrumb-current">${matchLabel}</span>`);
      }
      if (currentSongTab !== null) {
        html += ` ＞ <span class="breadcrumb-current">${currentSongTab === 'final' ? '最終結果' : `${currentSongTab}曲目`}</span>`;
      }
      nav.innerHTML = html;
    }

    function navTo(level) {
      animStep = 0;
      if (level === 'dept') { currentDept = currentRound = currentMatch = currentSongTab = null; }
      else if (level === 'round') { currentRound = currentMatch = currentSongTab = null; }
      else if (level === 'match') { currentMatch = currentSongTab = null; }
      else if (level === 'song') { currentSongTab = null; }
      render();
    }

    function render(isBackgroundRefresh = false) {
      renderBreadcrumb();
      const view = document.getElementById('view-area');

      if (!currentDept) {
        const depts = Object.keys(treeData);
        if (depts.length === 0) {
          view.innerHTML = `<h1>データを読み込み中...</h1><p class="subtitle">スプレッドシートのデータを取得しています</p>`;
          return;
        }
        view.innerHTML = `<h1>部門を選択してください</h1><p class="subtitle">表示したい部門を選択して次へ進みます</p>
          <div class="card-grid">${depts.map(d => `<div class="selection-card" onclick="selectDept('${d}')">${d} 部門<div class="sub">クリックして決定</div></div>`).join('')}</div>`;
        return;
      }

      if (!currentRound) {
        const rounds = Object.keys(treeData[currentDept] || {});
        view.innerHTML = `<h1>ラウンドを選択してください</h1><p class="subtitle">【${currentDept}部門】のラウンドを選択してください</p>
          <div class="card-grid">${rounds.map(r => `<div class="selection-card" onclick="selectRound('${r}')">${r}<div class="sub">クリックして決定</div></div>`).join('')}</div>
          <button class="btn-back" onclick="navTo('dept')">← 部門選択に戻る</button>`;
        return;
      }

      if (!currentMatch) {
        const matches = Object.keys(treeData[currentDept]?.[currentRound] || {}).sort((a,b) => parseInt(a) - parseInt(b));
        view.innerHTML = `<h1>試合を選択してください</h1><p class="subtitle">【${currentDept}部門 / ${currentRound}】の対戦カードを選択してください</p>
          <div class="card-grid">${matches.map(m => `<div class="selection-card" onclick="selectMatch('${m}')">${getMatchDisplayName(currentDept, currentRound, m)}<div class="sub">結果表示へ進む</div></div>`).join('')}</div>
          <button class="btn-back" onclick="navTo('round')">← ラウンド選択に戻る</button>`;
        return;
      }

      if (currentSongTab === null) {
        const matchRows = treeData[currentDept]?.[currentRound]?.[currentMatch] || [];
        const songNums = Array.from(new Set(matchRows.map(r => r.songNum).filter(s => s && s !== "合計" && s !== "最終結果" && s !== "total"))).sort();

        let songCardsHTML = songNums.map(num => `<div class="selection-card" onclick="selectSongTab('${num}')">${num}曲目<div class="sub">${num}曲目のスコア結果</div></div>`).join('');
        songCardsHTML += `<div class="selection-card gold-card" onclick="selectSongTab('final')">最終結果<div class="sub">総合スコア</div></div>`;

        view.innerHTML = `<h1>表示する結果を選択してください</h1><p class="subtitle">【${currentDept}部門 / ${currentRound} ${getMatchDisplayName(currentDept, currentRound, currentMatch)}】</p>
          <div class="card-grid">${songCardsHTML}</div><button class="btn-back" onclick="navTo('match')">← 試合選択に戻る</button>`;
        return;
      }

      renderResultView(view, isBackgroundRefresh);
    }

    function selectDept(d) { currentDept = d; animStep = 0; render(); }
    function selectRound(r) { currentRound = r; animStep = 0; render(); }
    function selectMatch(m) { currentMatch = m; currentSongTab = null; animStep = 0; render(); }
    function selectSongTab(tab) { currentSongTab = tab; animStep = 0; render(); }

    function getAnimClass(targetStep, delayIndex = 0) {
      const delaySec = (delayIndex * 0.15).toFixed(2);
      const delayStyle = `style="transition-delay: ${delaySec}s;"`;
      if (animStep >= targetStep) {
        return `class="anim-target anim-visible" ${delayStyle}`;
      }
      return `class="anim-target anim-hidden" ${delayStyle}`;
    }

    function renderResultView(view, isBackgroundRefresh = false) {
      const matchRows = treeData[currentDept]?.[currentRound]?.[currentMatch] || [];
      
      const deptName = currentDept.toUpperCase();
      const isDoubles = deptName.includes("DOUBLES");
      const isStandard = deptName.includes("STANDARD");
      const isNext = deptName.includes("NEXT");
      const isUltimate = deptName.includes("ULTIMATE");
      const roundName = currentRound || "";

      const songMap = {};
      matchRows.forEach(r => {
        if (r.songName && r.songNum) songMap[r.songNum] = r.songName;
      });

      const songNums = Array.from(new Set(matchRows.map(r => r.songNum).filter(s => s && s !== "合計" && s !== "最終結果" && s !== "total"))).sort();

      let tabsHTML = songNums.map(num => `<button class="tab-btn ${currentSongTab === num ? 'active' : ''}" onclick="selectSongTab('${num}')">${num}曲目</button>`).join('') +
        `<button class="tab-btn ${currentSongTab === 'final' ? 'active' : ''}" onclick="selectSongTab('final')">最終結果</button>`;

      let tableHTML = "";
      let titleBannerHTML = "";

      if (currentSongTab === 'final') {
        titleBannerHTML = `<div class="song-title-banner">最終結果</div>`;
        const finalRows = matchRows.filter(r => r.songNum === "合計" || r.songNum === "最終結果" || r.songNum === "total");
        
        let participants = [];
        if (finalRows.length > 0) {
          participants = finalRows;
        } else {
          const nameTotals = {};
          const nameOrder = [];
          matchRows.forEach(r => {
            if (!nameTotals[r.name]) {
              nameTotals[r.name] = 0;
              nameOrder.push(r.name);
            }
            nameTotals[r.name] += r.score;
          });
          participants = nameOrder.map(n => ({ name: n, score: nameTotals[n] }));
        }

        const sortedScores = Array.from(new Set(participants.map(p => p.score))).sort((a,b) => b - a);
        let showRankRow = true;

        participants.forEach(p => {
          p.rank = sortedScores.indexOf(p.score) + 1;
          
          let badgeClass = "badge-black";
          let scoreClass = "";

          if (p.rank === 1) {
            scoreClass = "score-highest";
          } else {
            if (isDoubles || (isUltimate && roundName.includes("準決勝"))) {
              showRankRow = false;
            } else if (isUltimate && roundName.includes("決勝") && p.rank === 2) {
              scoreClass = "score-silver";
            }
          }

          if (p.rank === 1) badgeClass = "badge-gold";
          else if (p.rank === 2 && (isStandard || isNext)) badgeClass = "badge-silver";
          else if (p.rank === 3 && (isStandard || isNext)) badgeClass = "badge-bronze";
          else if (p.rank === 2) badgeClass = "badge-red"; 

          p.badgeClass = badgeClass;
          p.scoreClass = scoreClass;
        });

        let headerRow = `<tr><th class="row-header"></th>` +
          participants.map((p, idx) => {
            let colorClass = "";
            if (isDoubles) colorClass = (idx === 0) ? 'team-blue' : 'team-orange';
            return `<th class="player-header ${colorClass}">${p.name}</th>`;
          }).join('') + `</tr>`;

        let bodyRows = "";
        let finalStep = songNums.length + 1;

        if (isDoubles && finalRows.length > 0 && finalRows[0].p !== undefined) {
          // PERFECTの数字は標準の文字色（黒）にするため、クラス（p-perfect）を除去しています
          bodyRows += `<tr><td class="row-header"><span class="p-perfect">PERFECT 合計</span></td>` + participants.map(p => `<td><span ${getAnimClass(1, 0)} data-anim-step="1">${Number(p.p||0).toLocaleString()}</span></td>`).join('') + `</tr>`;
          bodyRows += `<tr><td class="row-header p-great">GREAT 合計</td>` + participants.map(p => `<td class="p-great"><span ${getAnimClass(1, 1)} data-anim-step="1">${Number(p.g||0).toLocaleString()}</span></td>`).join('') + `</tr>`;
          bodyRows += `<tr><td class="row-header p-good">GOOD 合計</td>` + participants.map(p => `<td class="p-good"><span ${getAnimClass(1, 2)} data-anim-step="1">${Number(p.gd||0).toLocaleString()}</span></td>`).join('') + `</tr>`;
          bodyRows += `<tr><td class="row-header p-bad">BAD 合計</td>` + participants.map(p => `<td class="p-bad"><span ${getAnimClass(1, 3)} data-anim-step="1">${Number(p.b||0).toLocaleString()}</span></td>`).join('') + `</tr>`;
          bodyRows += `<tr><td class="row-header p-miss">MISS 合計</td>` + participants.map(p => `<td class="p-miss"><span ${getAnimClass(1, 4)} data-anim-step="1">${Number(p.m||0).toLocaleString()}</span></td>`).join('') + `</tr>`;
          finalStep = 2; 
        } else {
          bodyRows = songNums.map((sNum, sIdx) => {
            const stepNum = sIdx + 1;
            const sName = songMap[sNum] ? `<br><small style="font-weight:normal; color:#555;">（${formatSongName(songMap[sNum])}）</small>` : '';
            let row = `<tr><td class="row-header">${sNum}曲目${sName}</td>`;
            
            const sScores = participants.map(p => {
              const item = matchRows.find(r => r.name === p.name && String(r.songNum) === String(sNum));
              return item ? item.score : 0;
            });
            const maxSScore = Math.max(...sScores);

            participants.forEach((p) => {
              const item = matchRows.find(r => r.name === p.name && String(r.songNum) === String(sNum));
              const sScore = item ? item.score : 0;
              const sFlg = item ? item.flg : "";
              const isHighest = (sScore === maxSScore && sScore > 0);
              row += `<td class="sub-score"><span ${getAnimClass(stepNum, 0)} data-anim-step="${stepNum}">${renderScoreCell(sScore, sFlg, isHighest ? "score-highest" : "", true)}</span></td>`;
            });
            return row + `</tr>`;
          }).join('');
        }

        let totalRow = `<tr><td class="row-header" style="font-size:1.25rem; color:#006699;">合計得点</td>` + participants.map((p) => {
          return `<td class="score"><span ${getAnimClass(finalStep, 0)} data-anim-step="${finalStep}">${renderScoreCell(p.score, "", p.scoreClass, false)}</span></td>`;
        }).join('') + `</tr>`;

        let rankRow = "";
        if (showRankRow) {
          rankRow = `<tr><td class="row-header" style="font-size:1.25rem; color:#111;">順位</td>` + participants.map((p) => {
            return `<td><span ${getAnimClass(finalStep, 2)} data-anim-step="${finalStep}"><span class="rank-badge ${p.badgeClass}">${p.rank}位</span></span></td>`;
          }).join('') + `</tr>`;
        }

        tableHTML = `<thead>${headerRow}</thead><tbody>${bodyRows}${totalRow}${rankRow}</tbody>`;

      } else {
        const rawSongName = songMap[currentSongTab];
        const songNameStr = rawSongName ? formatSongName(rawSongName) : "";
        titleBannerHTML = `<div class="song-title-banner">${currentSongTab}曲目${songNameStr ? ` : ${songNameStr}` : ''}</div>`;

        const targetRows = matchRows.filter(r => String(r.songNum) === String(currentSongTab));
        const playerNames = Array.from(new Set(targetRows.map(r => r.name)));
        const playersData = playerNames.map(name => targetRows.find(r => r.name === name));

        let headerRow = `<tr><th class="row-header"></th>` +
          playersData.map((r, idx) => {
            let colorClass = "";
            if (isDoubles) {
              if (playersData.length === 4) colorClass = (idx < 2) ? 'team-blue' : 'team-orange';
              else colorClass = (idx === 0) ? 'team-blue' : 'team-orange';
            }
            return `<th class="player-header ${colorClass}">${r.name}</th>`;
          }).join('') + `</tr>`;

        const parseVal = (v) => { const n = parseInt(v, 10); return isNaN(n) ? "0" : n.toLocaleString(); };

        // PERFECTの数字は標準の文字色（黒）にするため、クラス（p-perfect）を除去しています
        let pRow  = `<tr><td class="row-header"><span class="p-perfect">PERFECT</span></td>` + playersData.map(r => `<td><span ${getAnimClass(1, 0)} data-anim-step="1">${parseVal(r.p)}</span></td>`).join('') + `</tr>`;
        let gRow  = `<tr><td class="row-header p-great">GREAT</td>` + playersData.map(r => `<td class="p-great"><span ${getAnimClass(1, 1)} data-anim-step="1">${parseVal(r.g)}</span></td>`).join('') + `</tr>`;
        let gdRow = `<tr><td class="row-header p-good">GOOD</td>` + playersData.map(r => `<td class="p-good"><span ${getAnimClass(1, 2)} data-anim-step="1">${parseVal(r.gd)}</span></td>`).join('') + `</tr>`;
        let bRow  = `<tr><td class="row-header p-bad">BAD</td>` + playersData.map(r => `<td class="p-bad"><span ${getAnimClass(1, 3)} data-anim-step="1">${parseVal(r.b)}</span></td>`).join('') + `</tr>`;
        let mRow  = `<tr><td class="row-header p-miss">MISS</td>` + playersData.map(r => `<td class="p-miss"><span ${getAnimClass(1, 4)} data-anim-step="1">${parseVal(r.m)}</span></td>`).join('') + `</tr>`;

        const maxScore = Math.max(...playersData.map(r => r.score));

        let scoreRow = `<tr><td class="row-header" style="font-size:1.25rem; color:#006699;">SCORE</td>` + playersData.map((r) => {
          const isHighest = (r.score === maxScore && r.score > 0);
          return `<td class="score"><span ${getAnimClass(2, 0)} data-anim-step="2">${renderScoreCell(r.score, r.flg, isHighest ? "score-highest" : "", true)}</span></td>`;
        }).join('') + `</tr>`;

        tableHTML = `<thead>${headerRow}</thead><tbody>${pRow}${gRow}${gdRow}${bRow}${mRow}${scoreRow}</tbody>`;
      }

      view.innerHTML = `<div class="tab-container">${tabsHTML}</div>
        ${titleBannerHTML}
        <div class="table-container">
          <table>${tableHTML}</table>
        </div>
        <button class="btn-back" onclick="navTo('match')">← 試合選択に戻る</button>`;
    }
  </script>
</body>
</html>
