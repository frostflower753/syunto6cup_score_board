<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リザルト発表</title>
    <style>
        :root {
            --bg-color: #f4f7fc;
            --card-bg: #ffffff;
            --border-color: #e5e9f0;
            --text-main: #333333;
            --header-bg: #ebf3ff;
            --header-text: #1d4ed8;
            
            /* 判定の色設定 */
            --color-perfect: #a855f7;
            --color-great: #ec4899;
            --color-good: #06b6d4;
            --color-bad: #84cc16;
            --color-miss: #64748b;
            --color-score: #0284c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        /* テーブル全体デザイン */
        .result-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .result-table th, 
        .result-table td {
            text-align: center;
            padding: 16px 12px;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            vertical-align: middle;
            font-size: 1.1rem;
            position: relative;
        }

        .result-table th:last-child, 
        .result-table td:last-child {
            border-right: none;
        }

        .result-table tr:last-child td {
            border-bottom: none;
        }

        /* ヘッダー（プレイヤー名） */
        .result-table th {
            background-color: var(--header-bg);
            color: var(--header-text);
            font-weight: bold;
            font-size: 1.2rem;
            width: 17%;
        }

        .result-table th.label-col {
            background-color: transparent;
            width: 15%;
        }

        /* 各行のラベル */
        .label-cell {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }
        .label-perfect { color: var(--color-perfect); }
        .label-great   { color: var(--color-great); }
        .label-good    { color: var(--color-good); }
        .label-bad     { color: var(--color-bad); }
        .label-miss    { color: var(--color-miss); }
        .label-score   { color: var(--text-main); font-size: 1.2rem; }

        /* 数値データセル */
        .val-perfect { color: var(--color-perfect); font-weight: bold; }
        .val-great   { color: var(--color-great); font-weight: bold; }
        .val-good    { color: var(--color-good); font-weight: bold; }
        .val-bad     { color: var(--color-bad); font-weight: bold; }
        .val-miss    { color: var(--color-miss); font-weight: bold; }
        
        .val-score {
            color: var(--color-score);
            font-weight: 900;
            font-size: 1.6rem;
        }

        /* バッジ演出 */
        .badge-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .badge {
            font-size: 0.65rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            padding: 2px 6px;
            border-radius: 3px;
            margin-bottom: 2px;
            text-transform: uppercase;
            display: inline-block;
            transform: rotate(-3deg);
        }

        .badge-fullcombo {
            color: #ec4899;
            background-color: #fce7f3;
            border: 1px solid #fbcfe8;
        }

        .badge-allperfect {
            color: #d97706;
            background-color: #fef3c7;
            border: 1px solid #fde68a;
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.4);
        }

        /* アニメーション用クラス */
        .hidden-content {
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .show-content {
            opacity: 1;
            transform: scale(1);
        }

        /* ヒント表示 */
        .hint {
            margin-top: 20px;
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
        }
        
        .hint span {
            background: #e2e8f0;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <table class="result-table">
            <thead>
                <tr>
                    <th class="label-col"></th>
                    <th>雷来</th>
                    <th>転生ぽんず</th>
                    <th>たけぽん</th>
                    <th>素豆腐</th>
                    <th>レザリア</th>
                </tr>
            </thead>
            <tbody>
                <!-- PERFECT -->
                <tr>
                    <td class="label-cell label-perfect">PERFECT</td>
                    <td><span class="val-perfect step-1 hidden-content">1</span></td>
                    <td><span class="val-perfect step-1 hidden-content">2</span></td>
                    <td><span class="val-perfect step-1 hidden-content">0</span></td>
                    <td><span class="val-perfect step-1 hidden-content">0</span></td>
                    <td><span class="val-perfect step-1 hidden-content">1</span></td>
                </tr>
                <!-- GREAT -->
                <tr>
                    <td class="label-cell label-great">GREAT</td>
                    <td><span class="val-great step-1 hidden-content">1</span></td>
                    <td><span class="val-great step-1 hidden-content">0</span></td>
                    <td><span class="val-great step-1 hidden-content">0</span></td>
                    <td><span class="val-great step-1 hidden-content">0</span></td>
                    <td><span class="val-great step-1 hidden-content">0</span></td>
                </tr>
                <!-- GOOD -->
                <tr>
                    <td class="label-cell label-good">GOOD</td>
                    <td><span class="val-good step-1 hidden-content">0</span></td>
                    <td><span class="val-good step-1 hidden-content">0</span></td>
                    <td><span class="val-good step-1 hidden-content">0</span></td>
                    <td><span class="val-good step-1 hidden-content">2</span></td>
                    <td><span class="val-good step-1 hidden-content">0</span></td>
                </tr>
                <!-- BAD -->
                <tr>
                    <td class="label-cell label-bad">BAD</td>
                    <td><span class="val-bad step-1 hidden-content">0</span></td>
                    <td><span class="val-bad step-1 hidden-content">0</span></td>
                    <td><span class="val-bad step-1 hidden-content">2</span></td>
                    <td><span class="val-bad step-1 hidden-content">0</span></td>
                    <td><span class="val-bad step-1 hidden-content">0</span></td>
                </tr>
                <!-- MISS -->
                <tr>
                    <td class="label-cell label-miss">MISS</td>
                    <td><span class="val-miss step-1 hidden-content">0</span></td>
                    <td><span class="val-miss step-1 hidden-content">0</span></td>
                    <td><span class="val-miss step-1 hidden-content">0</span></td>
                    <td><span class="val-miss step-1 hidden-content">0</span></td>
                    <td><span class="val-miss step-1 hidden-content">1</span></td>
                </tr>
                <!-- 得点 -->
                <tr>
                    <td class="label-cell label-score">得点</td>
                    <td>
                        <div class="badge-container step-2 hidden-content">
                            <span class="badge badge-fullcombo">FULL COMBO</span>
                            <span class="val-score">5</span>
                        </div>
                    </td>
                    <td>
                        <div class="badge-container step-2 hidden-content">
                            <span class="badge badge-allperfect">ALL PERFECT</span>
                            <span class="val-score" style="color: #d97706;">6</span>
                        </div>
                    </td>
                    <td>
                        <div class="badge-container step-2 hidden-content">
                            <span class="val-score">0</span>
                        </div>
                    </td>
                    <td>
                        <div class="badge-container step-2 hidden-content">
                            <span class="val-score">2</span>
                        </div>
                    </td>
                    <td>
                        <div class="badge-container step-2 hidden-content">
                            <span class="val-score">3</span>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="hint">
            <span>Enter</span> キーを押すと結果が表示されます (<span id="step-indicator">0</span>/2)
        </div>
    </div>

    <script>
        let currentStep = 0;
        const maxStep = 2;

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (currentStep < maxStep) {
                    currentStep++;
                    
                    // 該当ステップの要素をすべて表示
                    const elements = document.querySelectorAll(`.step-${currentStep}`);
                    elements.forEach(el => {
                        el.classList.add('show-content');
                    });

                    // インジケーター更新
                    document.getElementById('step-indicator').textContent = currentStep;
                }
            }
        });
    </script>
</body>
</html>
